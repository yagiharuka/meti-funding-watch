name: One-time JOGMEC official source discovery

on:
  push:
    branches:
      - reingest/jogmec-full-history
    paths:
      - ".github/workflows/jogmec-discovery-once.yml"

permissions:
  contents: write

concurrency:
  group: one-time-jogmec-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out discovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reingest/jogmec-full-history
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inventory official JOGMEC contract and adoption result sources
        run: node scripts/diagnose-jogmec-official-sources.mjs
      - name: Preserve discovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jogmec-source-discovery-${{ github.run_id }}
          path: .audit/jogmec-discovery
          retention-days: 90
      - name: Commit the inventory and remove one-time machinery
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .audit/jogmec-discovery
          git rm .github/workflows/jogmec-discovery-once.yml scripts/diagnose-jogmec-official-sources.mjs
          git commit -m "audit: inventory JOGMEC official result sources"
          for attempt in 1 2 3; do
            git pull --rebase origin reingest/jogmec-full-history
            if git push origin HEAD:reingest/jogmec-full-history; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
          done
