name: One-off central history hardening

on:
  push:
    branches: [main]
    paths:
      - "probe-central-history-trigger.txt"

permissions:
  contents: write

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pinned METI legacy evidence
        run: node scripts/oneoff-build-meti-legacy-evidence.mjs
      - name: Commit verified evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official-meti-legacy-evidence.json meti-legacy-rejected.json
          git diff --cached --check
          git commit -m "Add verified METI history back to FY2017"
          git pull --rebase origin main
          git push
