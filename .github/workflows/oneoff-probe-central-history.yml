name: One-off central history hardening

on:
  push:
    branches: [main]
    paths:
      - "probe-central-history-trigger.txt"

permissions:
  contents: write
  actions: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OFFICIAL_BOOTSTRAP_EVIDENCE_DIRECTORY: evidence/official-bootstrap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire verified legacy evidence into production updater
        run: node scripts/oneoff-integrate-meti-legacy.mjs
      - name: Verify legacy definitions and Heisei parsing
        run: node --test tests/official-heisei-date.test.mjs tests/official-meti-legacy.test.mjs
      - name: Refresh official data with continuity protection
        run: npm run update:official
      - name: Verify official data and Pages build
        run: |
          node --test tests/official-data.test.mjs tests/official-evidence-receipts.test.mjs tests/official-golden-records.test.mjs tests/official-meti-legacy.test.mjs tests/official-heisei-date.test.mjs
          npm run test:pages
      - name: Commit only verified integration and official data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/update-official-data.mjs scripts/official-meti-legacy-history.mjs tests/official-heisei-date.test.mjs tests/official-meti-legacy.test.mjs package.json data/official data/official-supplement-index.json data/official-meti-legacy-evidence.json
          git diff --cached --check
          git commit -m "Backfill verified METI headquarters data to FY2017"
          git pull --rebase origin main
          git push
      - name: Publish verified Pages release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-data.yml --ref main -f publish_only=true
