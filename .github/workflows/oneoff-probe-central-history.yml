name: One-off probe central official history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-probe-central-history.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe WARP historical sources with strict parser
        run: |
          set +e
          node scripts/oneoff-probe-central-history.mjs > central-history-warp-probe.log 2>&1
          code=$?
          echo "CENTRAL_WARP_PROBE_EXIT=$code" >> central-history-warp-probe.log
          cat central-history-warp-probe.log
          exit 0
      - name: Commit probe result for inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add central-history-warp-probe.log
          git commit -m "chore(audit): record central WARP probe"
          git pull --rebase origin main
          git push

