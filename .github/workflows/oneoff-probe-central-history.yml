name: One-off finalize central history backfill

on:
  push:
    branches: [main]
    paths:
      - "probe-central-history-trigger.txt"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify historical date parser
        run: node --test tests/official-heisei-date.test.mjs

      - name: Build verified METI headquarters historical rows
        run: node scripts/oneoff-build-meti-legacy-records.mjs

      - name: Validate historical corpora
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const meti = JSON.parse(await readFile('data/official-meti-legacy-records.json', 'utf8'));
          const central = JSON.parse(await readFile('data/official-central-history.json', 'utf8'));
          if (meti.schemaVersion !== 1 || meti.recordCount !== 3598 || meti.records.length !== 3598) throw new Error('METI legacy record count mismatch');
          if (!meti.records.some((r) => r.fiscalYear === 2017 && r.category === 'contract_result')) throw new Error('FY2017 METI contracts missing');
          if (!meti.records.some((r) => r.fiscalYear === 2017 && r.category === 'grant_decision')) throw new Error('FY2017 METI grants missing');
          if (meti.records.some((r) => r.executorId !== 'meti')) throw new Error('non-METI row in METI legacy corpus');
          if (central.schemaVersion !== 1 || central.records.length !== 599) throw new Error('central institution history mismatch');
          const counts = Object.groupBy(central.records, (r) => r.sourceId);
          if ((counts.smrj?.length ?? 0) !== 577) throw new Error('SMRJ history mismatch');
          if ((counts.nedo?.length ?? 0) !== 22) throw new Error('NEDO history mismatch');
          NODE

      - name: Remove one-off probe workflows before governance tests
        run: |
          rm -f \
            .github/workflows/oneoff-probe-central-agencies.yml \
            .github/workflows/oneoff-probe-central-history.yml \
            .github/workflows/oneoff-probe-institution-pdfs.yml \
            .github/workflows/oneoff-probe-jpo-h29.yml

      - name: Verify complete Pages build
        run: npm run test:pages

      - name: Commit verified historical corpora and clean workflow state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official-meti-legacy-records.json .github/workflows
          git diff --cached --check
          git commit -m "Publish verified central agency history from FY2017"
          git pull --rebase origin main
          git push

      - name: Publish the verified clean main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-data.yml --ref main -f publish_only=true
