name: One-off central history hardening

on:
  push:
    branches: [main]
    paths:
      - "probe-central-history-trigger.txt"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OFFICIAL_BOOTSTRAP_EVIDENCE_DIRECTORY: evidence/official-bootstrap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run integration stages with persistent diagnostics
        run: |
          set +e
          : > meti-legacy-integration.log
          run_stage() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a meti-legacy-integration.log
            "$@" >> meti-legacy-integration.log 2>&1
            code=$?
            echo "EXIT $name=$code" | tee -a meti-legacy-integration.log
            return $code
          }
          run_stage patch node scripts/oneoff-integrate-meti-legacy.mjs || exit 0
          run_stage definitions node --test tests/official-heisei-date.test.mjs tests/official-meti-legacy.test.mjs || exit 0
          run_stage update npm run update:official || exit 0
          run_stage official-tests node --test tests/official-data.test.mjs tests/official-evidence-receipts.test.mjs tests/official-golden-records.test.mjs tests/official-meti-legacy.test.mjs tests/official-heisei-date.test.mjs || exit 0
          run_stage pages npm run test:pages || exit 0
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -f meti-legacy-integration.log || echo "diagnostic log missing" > meti-legacy-integration.log
          git add meti-legacy-integration.log
          git commit -m "chore(audit): record METI legacy integration diagnostics" || exit 0
          git pull --rebase origin main
          git push
