name: One-off central history hardening

on:
  push:
    branches: [main]
    paths:
      - "probe-central-history-trigger.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify historical parser behavior
        run: node --test tests/official-heisei-date.test.mjs
      - name: Build verified historical company rows
        run: node scripts/oneoff-build-meti-legacy-records.mjs
      - name: Validate generated static corpus
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const data = JSON.parse(await readFile('data/official-meti-legacy-records.json', 'utf8'));
          if (data.schemaVersion !== 1 || data.recordCount !== 3598 || data.records.length !== 3598) throw new Error('METI legacy record count mismatch');
          if (!data.records.some((r) => r.fiscalYear === 2017 && r.category === 'contract_result')) throw new Error('FY2017 contracts missing');
          if (!data.records.some((r) => r.fiscalYear === 2017 && r.category === 'grant_decision')) throw new Error('FY2017 grants missing');
          if (data.records.some((r) => r.executorId !== 'meti')) throw new Error('non-METI row in legacy corpus');
          NODE
      - name: Commit verified static legacy corpus
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official-meti-legacy-records.json
          git diff --cached --check
          git commit -m "Add verified METI headquarters company history to FY2017"
          git pull --rebase origin main
          git push
