name: Retry SMRJ headquarters history reingest v10

on:
  push:
    branches:
      - reingest/smrj-hq-history-20260825-release5
    paths:
      - ".github/workflows/retry-smrj-hq-history-v10.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: retry-smrj-hq-history-v4
  cancel-in-progress: true

jobs:
  reingest_merge_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the reingest branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reingest/smrj-hq-history-20260825-release5
          fetch-depth: 0

      - name: Check pull request state
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          merged_at=$(gh pr view 73 --json mergedAt --jq '.mergedAt // ""')
          if [ -n "$merged_at" ]; then echo "merged=true" >> "$GITHUB_OUTPUT"; else echo "merged=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node.js
        if: steps.pr.outputs.merged != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.merged != 'true'
        run: npm ci

      - name: Run live reingest with three parsing strategies
        if: steps.pr.outputs.merged != 'true'
        id: reingest
        shell: bash
        run: |
          mkdir -p .audit
          set +e
          bash scripts/run-smrj-hq-reingest-v10.sh > .audit/smrj-hq-full-history-v10.log 2>&1
          status=$?
          set -e
          cat .audit/smrj-hq-full-history-v10.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Preserve failure evidence and comment on PR 73
        if: steps.pr.outputs.merged != 'true' && steps.reingest.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp .audit/smrj-hq-full-history-v10.log /tmp/smrj-v10-failure.log
          git restore .
          git clean -fd
          mkdir -p .audit
          cp /tmp/smrj-v10-failure.log .audit/smrj-hq-full-history-v10.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .audit/smrj-hq-full-history-v10.log
          git commit -m "chore(audit): record SMRJ headquarters v10 reingest failure" || true
          git pull --rebase origin reingest/smrj-hq-history-20260825-release5
          git push origin HEAD:reingest/smrj-hq-history-20260825-release5
          {
            echo '### 中小機構本部・全履歴再収録 v10 の失敗ログ'
            echo
            echo '```text'
            tail -n 300 .audit/smrj-hq-full-history-v10.log
            echo '```'
          } > /tmp/smrj-comment.md
          gh pr comment 73 --body-file /tmp/smrj-comment.md
          exit 1

      - name: Commit the validated full-history result
        if: steps.pr.outputs.merged != 'true' && steps.reingest.outputs.status == '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(data): reingest SMRJ headquarters full history"
          git restore .
          git clean -fd
          git pull --rebase origin reingest/smrj-hq-history-20260825-release5
          git push origin HEAD:reingest/smrj-hq-history-20260825-release5

      - name: Squash merge PR 73
        if: steps.pr.outputs.merged != 'true' && steps.reingest.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 73 --squash --admin \
            --subject "中小機構本部の競争入札・随意契約を2015年度から再収録" \
            --body "本部のみを対象に、競争入札・随意契約の公式PDFと公式ページ上の該当なし表示を年度×契約類型で棚卸しし、既存・layout・TSV三段parser、行数会計、fail-closed検証を通過した履歴を公開する。"

      - name: Publish and verify GitHub Pages
        if: steps.pr.outputs.merged != 'true' && steps.reingest.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run update-data.yml --ref main -f publish_only=true
          sleep 10
          run_id=$(gh run list --workflow update-data.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Publication workflow run was not found."
            exit 1
          fi
          gh run watch "$run_id" --exit-status
