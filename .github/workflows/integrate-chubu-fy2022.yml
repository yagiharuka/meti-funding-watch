name: Integrate Chubu FY2022 verified sources

on:
  push:
    paths:
      - ".github/workflows/integrate-chubu-fy2022.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install exact audited FY2022 originals
        shell: bash
        run: |
          set -euo pipefail
          archive='https://warp.ndl.go.jp/20260613/20260601101404/'
          root='https://www.chubu.meti.go.jp/a41kaikei/kouhyou/data'
          check(){ rel="$1" bytes="$2" sha="$3" dest="$4"; tmp="/tmp/${rel##*/}"; curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' "${archive}${root}/${rel}" -o "$tmp"; test "$(wc -c < "$tmp")" -eq "$bytes"; test "$(sha256sum "$tmp"|cut -d' ' -f1)" = "$sha"; head -c 5 "$tmp" | grep -q '%PDF-'; cp "$tmp" "evidence/official-bootstrap/$dest"; }
          check hojyokin/r4fy_4-9.pdf 393052 8eae0800f65273cc3543d61dcc5a45c677e490b6f0b394cc401ec7d642667670 chubu-2022-grant-decisions-h1.pdf
          check hojyokin/r4fy_10-3.pdf 135918 a2710a4ca4ab2307576721342aaacff6d611a95905a7061902c2caee6738fba2 chubu-2022-grant-decisions-h2.pdf
          check nyusatsu/22-nyusatsu-itaku.pdf 135508 84d958e5847a5e0864d6fcc6142745f7b2e444c3cacab72caf9853f0457816c1 chubu-2022-competitive-commission.pdf
          check nyusatsu/22-ukeoi.pdf 183778 8fc64f358cfaa8509f927d5299cb6ae88944b4e7d9a0c19a1aa5265e30d7cd72 chubu-2022-competitive-goods.pdf
          check zuikei/22-zuikei-itaku.pdf 222222 bc41295700790dd6b421ad08e77809dbd81a81f52d87b9c62f48cf3ba7ab2bdb chubu-2022-discretionary-commission.pdf
          check zuikei/22-zuikei-ukeoi.pdf 90326 c33b9b5da9987937aa7909ef313441baca4aa38fc10d5f200645fc4efb727c45 chubu-2022-discretionary-goods.pdf
      - name: Define and register FY2022 sources
        shell: bash
        run: |
          cat > scripts/official-chubu-fy2022-sources.mjs <<'EOF'
          const SOURCE_PAGE="https://www.chubu.meti.go.jp/a41kaikei/kouhyou/index.html";
          const ROOT="https://www.chubu.meti.go.jp/a41kaikei/kouhyou/data/";
          const WARP="https://warp.ndl.go.jp/20260613/20260601101404/";
          const PW=841.68;
          const ARCHIVE_PROVIDER="国立国会図書館インターネット資料収集保存事業（WARP）";
          const archive=(url,bytes,sha,rows)=>({discoveryStatus:"linked_from_official_index_archive_byte_pinned",verifiedAt:"2026-08-15",sourcePageUrl:SOURCE_PAGE,url:`${WARP}${url}`,originalUrl:url,archiveProvider:ARCHIVE_PROVIDER,archiveVerifiedAt:"2026-08-15",archiveVerification:"公式目次の保存HTMLにある実hrefをFull GETし、原本のbytes・SHA-256・magic・全行parseを固定",archiveExpectedBytes:bytes,archiveExpectedSha256:sha,archiveExpectedRecordCount:rows});
          const receipt=(bytes,sha,rows)=>Object.freeze({expectedMagic:"%PDF-",expectedBytes:bytes,expectedSha256:sha,expectedRecordCount:rows});
          const cols=(defs,left)=>defs.map(([key,headerAliases],i)=>({key,headerAliases,leftRatio:left[i]/PW}));
          const GRANT=[["ordinal",["番号"]],["program",["事業名"]],["organization",["交付先名"]],["corporateNumber",["法人番号"]],["amount",["交付決定額"]],["account",["支出元会計区分"]],["budgetItem",["支出元(目)名称"]],["date",["交付決定日"]],["publicInterestClass",["公益法人の区分"]],["jurisdictionClass",["国所管、都道府"]]];
          const COMP=[["program",["物品役務等の"]],["officer",["契約担当官等の"]],["date",["契約を締結"]],["organization",["商号又は名称"]],["corporateNumber",["法人番号"]],["address",["住所"]],["method",["一般競争入札・"]],["plannedAmount",["予定価格"]],["amount",["契約金額"]],["awardRate",["落札率"]],["notes",["備考"]],["publicInterestClass",["公益法人"]],["jurisdictionClass",["国所管、"]],["bidderCount",["応札・"]]];
          const DISC=[["program",["物品役務等の"]],["officer",["契約担当官等の"]],["date",["契約を締結"]],["organization",["方の商号"]],["corporateNumber",["法人番号"]],["address",["の住所"]],["legalReason",["随意契約によること"]],["plannedAmount",["予定価格"]],["amount",["契約金額"]],["awardRate",["落札率"]],["reemployedOfficerCount",["再就職"]],["notes",["備考"]],["publicInterestClass",["公益法人"]],["jurisdictionClass",["国所管、"]],["bidderCount",["応札・"]]];
          const DISC_OLD=[["program",["物品役務等の名称"]],["officer",["契約担当官等の氏名"]],["date",["契約を締結した日"]],["organization",["契約の相手方の商号"]],["address",["契約の相手方の住所"]],["corporateNumber",["契約の相手方の法人番号"]],["legalReason",["随意契約によることとした"]],["plannedAmount",["予定価格"]],["amount",["契約金額"]],["awardRate",["落札率"]],["reemployedOfficerCount",["再就職の役員"]],["publicInterestClass",["公益法人の区"]],["jurisdictionClass",["国所管、都道府"]],["bidderCount",["応札・応募者数"]],["notes",["備考"]]];
          function grant({id,file,period,bytes,sha,rowsPer,items}){const rows=rowsPer.reduce((a,b)=>a+b,0), first=period==="4月～9月", url=`${ROOT}hojyokin/${file}`; return Object.freeze({id,executorId:"chubu",executorName:"中部経済産業局",fiscalYear:2022,category:"grant_decision",kind:`補助金等の交付決定（${period}）`,amountStage:"交付決定額欄の掲載値",format:"pdf",...archive(url,bytes,sha,rows),coverageClaim:`WARP保存時点の令和4年度${period}の公式文字PDF全${rowsPer.length}ページに掲載された${rows}行`,pdfSchema:Object.freeze({schemaVersion:1,extractionMode:"positioned_text_only",normalizeCompatibilityText:true,expectedBytes:bytes,expectedSha256:sha,expectedPageCount:rowsPer.length,expectedPageSize:{width:PW,height:595.2,tolerance:0.2},expectedRowsPerPage:rowsPer,expectedRecordCount:rows,expectedRowNumbers:{start:1,end:rows},headersOnFirstPageOnly:true,requiredPageText:[],requiredFirstPageText:["令和04年度補助金等の情報","中部経済産業局"],columns:cols(GRANT,[28,50,215,340,405,460,550,665,725,760]),recordMapping:{ordinalColumn:"ordinal",programColumn:"program",organizationColumn:"organization",corporateNumberColumn:"corporateNumber",amountColumn:"amount",dateColumn:"date",notesColumns:["account","budgetItem"]},allowedDateFormats:["reiwa_ymd_ja"],dateRange:first?{start:"2022-04-01",end:"2022-09-30"}:{start:"2022-10-01",end:"2023-03-31"},corporateNumberMissingSentinels:["","-","－"],minimumPositionedTextItems:items,expectedPositionedTextItemCount:items}),evidenceReceipt:receipt(bytes,sha,rows)});}
          function contract({id,file,type,cost,bytes,sha,rowsPer,items,height=595.2,old=false}){const competitive=type==="competitive", rows=rowsPer.reduce((a,b)=>a+b,0), sub=competitive?"nyusatsu":"zuikei", url=`${ROOT}${sub}/${file}`, defs=competitive?COMP:(old?DISC_OLD:DISC), left=competitive?[15,75,155,215,280,345,415,495,545,595,640,675,715,765]:(old?[5,53,136,182,234,287,351,497,545,583,606,642,681,720,770]:[15,70,140,195,245,305,370,465,520,570,610,645,680,725,780]); return Object.freeze({id,executorId:"chubu",executorName:"中部経済産業局",fiscalYear:2022,category:"contract_result",kind:`${competitive?"競争入札":"随意契約"}（${cost}）`,amountStage:"契約金額欄の掲載値",format:"pdf",...archive(url,bytes,sha,rows),coverageClaim:`WARP保存時点の令和4年度・${competitive?"競争入札":"随意契約"}（${cost}）公式文字PDF全${rowsPer.length}ページに掲載された${rows}行`,pdfSchema:Object.freeze({schemaVersion:1,extractionMode:"positioned_text_only",normalizeCompatibilityText:true,rowAnchorMode:"date",expectedBytes:bytes,expectedSha256:sha,expectedPageCount:rowsPer.length,expectedPageSize:{width:PW,height,tolerance:0.2},expectedRowsPerPage:rowsPer,expectedRecordCount:rows,expectedRowNumbers:{start:1,end:rows},...(rowsPer.length>1?{headersOnFirstPageOnly:true}:{}),requiredPageText:[],requiredFirstPageText:["公共調達の適正化について",`${competitive?"競争入札":"随意契約"}に係る情報の公表`],columns:cols(defs,left),recordMapping:{programColumn:"program",organizationColumn:"organization",corporateNumberColumn:"corporateNumber",amountColumn:"amount",dateColumn:"date",methodColumn:competitive?"method":"legalReason",notesColumns:["notes"]},allowedDateFormats:["western_ymd_ja"],dateRange:{start:"2022-04-01",end:"2023-03-31"},corporateNumberMissingSentinels:["","-","－","法人番号なし"],minimumPositionedTextItems:items,expectedPositionedTextItemCount:items}),evidenceReceipt:receipt(bytes,sha,rows)});}
          export const CHUBU_FY2022_GRANT_DOCUMENTS=Object.freeze([
            grant({id:"chubu-2022-grant-decisions-h1",file:"r4fy_4-9.pdf",period:"4月～9月",bytes:393052,sha:"8eae0800f65273cc3543d61dcc5a45c677e490b6f0b394cc401ec7d642667670",rowsPer:[21,22,25,25,25,24,23],items:2181}),
            grant({id:"chubu-2022-grant-decisions-h2",file:"r4fy_10-3.pdf",period:"10月～3月",bytes:135918,sha:"a2710a4ca4ab2307576721342aaacff6d611a95905a7061902c2caee6738fba2",rowsPer:[16,1],items:264}),
          ]);
          export const CHUBU_FY2022_CONTRACT_DOCUMENTS=Object.freeze([
            contract({id:"chubu-2022-competitive-commission",file:"22-nyusatsu-itaku.pdf",type:"competitive",cost:"委託費の類",bytes:135508,sha:"84d958e5847a5e0864d6fcc6142745f7b2e444c3cacab72caf9853f0457816c1",rowsPer:[10],items:315,height:1190.4}),
            contract({id:"chubu-2022-competitive-goods",file:"22-ukeoi.pdf",type:"competitive",cost:"庁費の類",bytes:183778,sha:"8fc64f358cfaa8509f927d5299cb6ae88944b4e7d9a0c19a1aa5265e30d7cd72",rowsPer:[6,7,7,5],items:712}),
            contract({id:"chubu-2022-discretionary-commission",file:"22-zuikei-itaku.pdf",type:"discretionary",cost:"委託費の類",bytes:222222,sha:"bc41295700790dd6b421ad08e77809dbd81a81f52d87b9c62f48cf3ba7ab2bdb",rowsPer:[7,6,4,3,3,3,5,6,5],items:1710}),
            contract({id:"chubu-2022-discretionary-goods",file:"22-zuikei-ukeoi.pdf",type:"discretionary",cost:"庁費の類",bytes:90326,sha:"c33b9b5da9987937aa7909ef313441baca4aa38fc10d5f200645fc4efb727c45",rowsPer:[6],items:206,old:true}),
          ]);
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/official-chubu-sources.mjs'); s=p.read_text()
          imp='import { CHUBU_FY2022_CONTRACT_DOCUMENTS, CHUBU_FY2022_GRANT_DOCUMENTS } from "./official-chubu-fy2022-sources.mjs";\n'
          if not s.startswith(imp): s=imp+s
          s=s.replace('export const CHUBU_GRANT_DOCUMENTS = Object.freeze([\n  ...CHUBU_FY2023_GRANT_DOCUMENTS,','export const CHUBU_GRANT_DOCUMENTS = Object.freeze([\n  ...CHUBU_FY2022_GRANT_DOCUMENTS,\n  ...CHUBU_FY2023_GRANT_DOCUMENTS,',1)
          s=s.replace('export const CHUBU_CONTRACT_DOCUMENTS = Object.freeze([\n  ...CHUBU_FY2023_CONTRACT_DOCUMENTS,','export const CHUBU_CONTRACT_DOCUMENTS = Object.freeze([\n  ...CHUBU_FY2022_CONTRACT_DOCUMENTS,\n  ...CHUBU_FY2023_CONTRACT_DOCUMENTS,',1)
          marker='export const CHUBU_COVERAGE_GAPS = Object.freeze([\n'
          add='  { executorId: "chubu", fiscalYear: 2022, category: "grant_decision", status: "verified_official_period_pair_archive", included: "WARP保存公式目次の実hrefから固定した4月～9月・10月～3月PDF（2資料・182掲載行）", missing: "保存公式目次時点の2資料を検証した範囲であり、年度母集団の完全性は主張しない" },\n  { executorId: "chubu", fiscalYear: 2022, category: "contract_result", status: "verified_official_files_four_categories_archive", included: "WARP保存公式目次の実hrefから固定した競争入札・随意契約の委託費・庁費PDF（4資料・83掲載行）", missing: "保存公式目次時点の4資料を検証した範囲であり、年度母集団の完全性は主張しない" },\n'
          if 'fiscalYear: 2022, category: "grant_decision"' not in s: s=s.replace(marker,marker+add,1)
          s=s.replace('included: "令和5・6年度の交付決定4資料と契約結果8資料",\n    missing: "令和2～4・7年度の交付決定・契約結果、および年度途中の令和8年度",','included: "令和4～6年度の交付決定6資料と契約結果12資料",\n    missing: "令和2・3・7年度の交付決定・契約結果、および年度途中の令和8年度",',1)
          p.write_text(s)
          p=Path('tests/official-chubu-sources.test.mjs'); s=p.read_text()
          anchor='const grants2023 = CHUBU_GRANT_DOCUMENTS.filter((document) => document.fiscalYear === 2023);\nconst contracts2023 = CHUBU_CONTRACT_DOCUMENTS.filter((document) => document.fiscalYear === 2023);\n'
          if 'const grants2022' not in s: s=s.replace(anchor,anchor+'const grants2022 = CHUBU_GRANT_DOCUMENTS.filter((document) => document.fiscalYear === 2022);\nconst contracts2022 = CHUBU_CONTRACT_DOCUMENTS.filter((document) => document.fiscalYear === 2022);\n',1)
          marker='test("registers and strictly replays six FY2023 Chubu PDFs from exact committed originals"'
          test='''test("registers and strictly replays six FY2022 Chubu PDFs from exact committed originals", { timeout: 30000 }, async () => {\n  assert.equal(grants2022.length,2); assert.equal(contracts2022.length,4); const records=[]; for(const document of [...grants2022,...contracts2022]){const bytes=await readFile(new URL(`../evidence/official-bootstrap/${document.id}.pdf`, import.meta.url)); const parsed=await parseOfficialPdf(bytes,document); assert.equal(parsed.length,document.evidenceReceipt.expectedRecordCount); records.push(...parsed);} assert.equal(records.length,265);\n});\n\n'''
          if 'strictly replays six FY2022' not in s: s=s.replace(marker,test+marker,1)
          p.write_text(s)
          p=Path('tests/official-evidence-receipts.test.mjs'); s=p.read_text().replace('assert.equal(evidenceDocuments.length, 360);','assert.equal(evidenceDocuments.length, 366);',1); p.write_text(s)
          PY
      - name: Verify exact addition, tests and build
        env:
          OFFICIAL_BOOTSTRAP_EVIDENCE_DIRECTORY: evidence/official-bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chubu-old && mkdir /tmp/chubu-old && cp data/official/records-*.json /tmp/chubu-old/
          npm run update:official
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises'; const load=async d=>{let o=[];for(const n of (await readdir(d)).filter(n=>/^records-.*\.json$/.test(n)))o.push(...JSON.parse(await readFile(`${d}/${n}`,'utf8')));return o}; const old=await load('/tmp/chubu-old'),fresh=await load('data/official'); if(old.length!==18205||fresh.length!==18470)throw Error(`counts ${old.length}/${fresh.length}`); const m=new Map(fresh.map(r=>[r.id,r])); let missing=0,changed=0; for(const r of old){const n=m.get(r.id);if(!n)missing++;else if(JSON.stringify(n)!==JSON.stringify(r))changed++;} if(missing||changed)throw Error(`prior changed ${missing}/${changed}`); const a=fresh.filter(r=>r.datasetId?.startsWith('chubu-2022-')); if(a.length!==265)throw Error(`added ${a.length}`); console.log('VERIFIED prior=18205 unchanged, added=265, total=18470');
          NODE
          npm run test:pages
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- data/official
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/official-chubu-fy2022-sources.mjs scripts/official-chubu-sources.mjs tests/official-chubu-sources.test.mjs tests/official-evidence-receipts.test.mjs evidence/official-bootstrap/chubu-2022-*.pdf
          git commit -m 'feat(official): add Chubu FY2022 verified records'
          git push
