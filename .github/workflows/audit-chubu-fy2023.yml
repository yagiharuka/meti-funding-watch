name: Audit Chubu FY2023 sources

on:
  push:
    paths:
      - ".github/workflows/audit-chubu-fy2023.yml"
      - "scripts/chubu-fy2023-trial.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download six exact saved official PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit-chubu
          prefix='https://warp.ndl.go.jp/20260613/20260601101404/https://www.chubu.meti.go.jp/a41kaikei/kouhyou/data'
          for rel in \
            hojyokin/r5fy_4-9.pdf hojyokin/r5fy_10-3.pdf \
            nyusatsu/23-nyusatsu-itaku.pdf nyusatsu/23-ukeoi.pdf \
            zuikei/23-zuikei-itaku.pdf zuikei/23-zuikei-ukeoi.pdf; do
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' "$prefix/$rel" -o ".audit-chubu/${rel##*/}"
          done
      - name: Replay through production parser
        run: node scripts/chubu-fy2023-trial.mjs
      - name: Preserve audited originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chubu-fy2023-audit-${{ github.run_id }}
          path: .audit-chubu/
          retention-days: 90
