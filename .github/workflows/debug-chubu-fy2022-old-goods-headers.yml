name: Inspect Chubu FY2022 legacy headers
on:
  push:
    paths:
      - ".github/workflows/debug-chubu-fy2022-old-goods-headers.yml"
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: chubu-fy2022-audit-31822469715
          path: .audit
          repository: yagiharuka/meti-funding-watch
          run-id: 31822469715
          github-token: ${{ github.token }}
      - name: Print legacy header centers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { getDocument, Util } from 'pdfjs-dist/legacy/build/pdf.mjs';
          import { readFile } from 'node:fs/promises';
          import { glob } from 'node:fs/promises';
          const files=[]; for await (const p of glob('.audit/**/22-zuikei-ukeoi.pdf')) files.push(p);
          const bytes=await readFile(files[0]); const pdf=await getDocument({data:new Uint8Array(bytes)}).promise; const page=await pdf.getPage(1); const viewport=page.getViewport({scale:1}); const tc=await page.getTextContent();
          const wanted=['物品役務等の名称','契約担当官等の氏名並びにその','契約を締結した日','契約の相手方の商号','契約の相手方の住所','契約の相手方の法人番号','随意契約によることとした会計法令の根拠条文及び理由','予定価格','契約金額','落札率','再就職の役員','公益法人の区','国所管、都道府','応札・応募者数','備考'];
          for(const raw of tc.items){if(!raw?.str||!wanted.includes(raw.str.normalize('NFKC')))continue; const t=Util.transform(viewport.transform,raw.transform); const x=t[4], y=viewport.height-t[5], width=Number(raw.width), center=x+width/2; console.log(JSON.stringify({text:raw.str,x,width,center,y}));}
          NODE
