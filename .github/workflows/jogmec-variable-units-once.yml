name: JOGMEC full reingest with broader unit-price handling

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jogmec-variable-units-once-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reingest:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'reingest/jogmec-full-history')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the JOGMEC reingest branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reingest/jogmec-full-history
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply JOGMEC integration and all verified parser regressions
        shell: bash
        run: |
          mkdir -p .audit
          node scripts/apply-jogmec-full-history-integration.mjs 2>&1 | tee .audit/jogmec-integration.log
          node scripts/patch-jogmec-live-layout.mjs 2>&1 | tee -a .audit/jogmec-integration.log
          node scripts/patch-jogmec-appendix.mjs 2>&1 | tee -a .audit/jogmec-integration.log
          node scripts/patch-jogmec-amount-punctuation.mjs 2>&1 | tee -a .audit/jogmec-integration.log
          node scripts/patch-jogmec-unit-amount.mjs 2>&1 | tee -a .audit/jogmec-integration.log
          node scripts/patch-jogmec-variable-units.mjs 2>&1 | tee -a .audit/jogmec-integration.log

      - name: Reingest every published JOGMEC competitive and discretionary contract PDF
        id: reingest
        shell: bash
        run: |
          mkdir -p .audit
          set +e
          node scripts/jogmec-official-supplement.mjs > .audit/jogmec-reingest.log 2>&1
          status=$?
          set -e
          cat .audit/jogmec-reingest.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Build indexes and run the full repository suite
        if: steps.reingest.outputs.status == '0'
        run: |
          node scripts/build-official-supplement-index.mjs
          node scripts/build-official-company-index.mjs
          npm test

      - name: Write the auditable JOGMEC reingest receipt
        if: steps.reingest.outputs.status == '0'
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const data = JSON.parse(await readFile("data/official-supplement-jogmec.json", "utf8"));
          const receipt = {
            generatedAt: new Date().toISOString(),
            collectionStatus: data.collectionStatus,
            minFiscalYear: data.minFiscalYear,
            maxFiscalYear: data.maxFiscalYear,
            documentCount: data.documentCount,
            parsedDocumentCount: data.parsedDocumentCount,
            totalRows: data.totalRows,
            publishedRowCount: data.publishedRowCount,
            amountUnavailableRowCount: data.amountUnavailableRowCount,
            nonTotalAmountRowCount: data.nonTotalAmountRowCount,
            nonJpyAmountRowCount: data.nonJpyAmountRowCount,
            parseFailureCount: data.parseFailureCount,
            sourceListUrls: data.listUrls,
          };
          await writeFile(".audit/jogmec-reingest.json", `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt));
          NODE

      - name: Preserve live-reingest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jogmec-variable-unit-reingest-${{ github.run_id }}
          path: |
            .audit/jogmec-integration.log
            .audit/jogmec-reingest.log
            .audit/jogmec-reingest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit verified JOGMEC source, data and ordinary CI
        if: steps.reingest.outputs.status == '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f \
            .github/workflows/jogmec-*-once.yml \
            scripts/apply-jogmec-full-history-integration.mjs \
            scripts/patch-jogmec-*.mjs
          git add \
            scripts/jogmec-official-supplement.mjs \
            scripts/build-official-supplement-index.mjs \
            scripts/build-official-company-index.mjs \
            pages-site/company-evidence-ui.ts \
            .github/workflows/update-data.yml \
            .github/workflows/refresh-official-data.yml \
            tests/jogmec-official-supplement.test.mjs \
            tests/official-supplement.test.mjs \
            tests/company-evidence-ui.test.mjs \
            data/official-supplement-jogmec.json \
            data/official-supplement-index.json \
            public/data/official-company-index.json \
            .github/workflows/ci.yml
          git add -f .audit/jogmec-reingest.json
          git commit -m "feat(data): reingest JOGMEC contract result history"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git pull --rebase origin reingest/jogmec-full-history
            if git push origin HEAD:reingest/jogmec-full-history; then
              exit 0
            fi
            echo "Push raced; retrying ($attempt/3)."
          done
          exit 1

      - name: Fail after preserving evidence when live reingest is invalid
        if: steps.reingest.outputs.status != '0'
        run: exit 1
