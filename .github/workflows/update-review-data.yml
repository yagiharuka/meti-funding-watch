name: Update administrative review data

on:
  workflow_dispatch:
  schedule:
    # RSシステムの週初めの配布切替と重ならないよう、火曜10:00 JSTに実行する。
    - cron: "0 1 * * 2"

permissions:
  contents: write
  actions: write

concurrency:
  group: administrative-review-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh administrative review official CSVs
        run: |
          node scripts/update-review-data.mjs --require-fresh
          node scripts/build-review-company-index.mjs
      - name: Verify review data
        run: npm run build:pages && node --test tests/review-data-model.test.mjs tests/review-data.test.mjs
      - name: Commit refreshed review data
        id: commit_data
        run: |
          if git diff --quiet -- data/review-cache data/review-company-index.json; then
            echo "Administrative review data unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/review-cache data/review-company-index.json
          git commit -m "chore(data): refresh administrative review data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push raced with another series; retrying ($attempt/3)."
          done
          echo "::error::Could not publish review data after three rebases."
          exit 1
      # GITHUB_TOKENで作ったbot commitはpush workflowを起動しないため、公開を明示的に依頼する。
      - name: Publish the refreshed snapshot
        if: steps.commit_data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-data.yml --ref main -f publish_only=true
