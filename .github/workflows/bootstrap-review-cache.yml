name: Bootstrap administrative review cache
on:
  push:
    paths: [".github/workflows/bootstrap-review-cache.yml"]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Restore last successfully acquired official review cache
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 21beab2198ec3c60955db83464171dd56dad152b
          rm -rf data/review-cache
          git checkout FETCH_HEAD -- data/review-cache
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir='data/review-cache';
          const old=JSON.parse(fs.readFileSync(path.join(dir,'manifest.json'),'utf8'));
          const programs=JSON.parse(fs.readFileSync(path.join(dir,old.programsFile),'utf8'));
          const payments=old.paymentFiles.flatMap((name)=>JSON.parse(fs.readFileSync(path.join(dir,name),'utf8')));
          const manifest={
            schemaVersion:3,
            generatedAt:'2026-08-06T00:00:00.000Z',
            lastSuccessfulSourceRefresh:'2026-08-06',
            refreshStatus:'cached-official-source-route-changed',
            sourceUrl:'https://rssystem.go.jp/download-csv',
            reviewSheetYears:old.reviewSheetYears,
            unavailableReviewSheetYears:[{reviewSheetYear:2026,reason:'2026年度レビューシートは2026年8月15日時点で経産省が9月以降公開予定と案内'}],
            programsFile:old.programsFile,
            paymentFiles:old.paymentFiles,
            programCount:programs.length,
            paymentCount:payments.length,
            sourceReceipts:[],
            bootstrapProvenance:{
              commit:'21beab2198ec3c60955db83464171dd56dad152b',
              description:'2026-08-06に行政事業レビュー公式CSVから取得・生成した検証済みキャッシュ。RSシステムの直接CSV経路変更後も値を補完せず保持。'
            },
            semantics:{
              paymentAmount:'行政事業レビュー公式CSV「支出先の合計支出額」掲載値',
              aggregationWarning:'上流・中間・終端の支出先を相互に合算しない。契約額・交付決定額・GビズINFO掲載値とも合算しない。',
              negativeSearchWarning:'未掲載・未収録・移行年度の詳細欠落があるため、0件を受給なしとは解釈しない。'
            }
          };
          fs.writeFileSync(path.join(dir,'manifest.json'),JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify({years:manifest.reviewSheetYears,programs:programs.length,payments:payments.length,files:old.paymentFiles.length}));
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/review-cache
          git commit -m 'chore(data): restore administrative review reference series'
          git push
