name: Integrate Chubu FY2023 verified sources

on:
  push:
    paths:
      - ".github/workflows/integrate-chubu-fy2023.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Recover the six exact audited PDFs
        uses: actions/download-artifact@v4
        with:
          name: chubu-fy2023-audit-31801741025
          path: .chubu-evidence
          repository: yagiharuka/meti-funding-watch
          run-id: 31801741025
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and install bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .chubu-evidence -name '*.pdf' | wc -l)" -eq 6
          check() {
            local src="$1" expected_bytes="$2" expected_sha="$3" dest="$4"
            test "$(wc -c < "$src")" -eq "$expected_bytes"
            test "$(sha256sum "$src" | cut -d' ' -f1)" = "$expected_sha"
            test "$(head -c 5 "$src")" = '%PDF-'
            cp "$src" "evidence/official-bootstrap/$dest"
          }
          check "$(find .chubu-evidence -name 'r5fy_4-9.pdf' -print -quit)" 418926 9ff29945ebc29911b723f5ac557e67f94890b6d9282c6986fff3c891606cff74 chubu-2023-grant-decisions-h1.pdf
          check "$(find .chubu-evidence -name 'r5fy_10-3.pdf' -print -quit)" 201458 d81b9409cf04fee5ce77245d179e66a34789df635e616575e6adff21580055a7 chubu-2023-grant-decisions-h2.pdf
          check "$(find .chubu-evidence -name '23-nyusatsu-itaku.pdf' -print -quit)" 120104 666ab5fba88ef2b043b939a64bf7cf6de0bef50e548531cafcfd0239004739d9 chubu-2023-competitive-commission.pdf
          check "$(find .chubu-evidence -name '23-ukeoi.pdf' -print -quit)" 171505 226da7ccb6ba81e52c33fb5c2ca52e2056466142730db5624452dd7157756987 chubu-2023-competitive-goods.pdf
          check "$(find .chubu-evidence -name '23-zuikei-itaku.pdf' -print -quit)" 223892 68d9e5c9c2e60d3882bc9f362cffb387513348824c664ff1eb9fcb68305be6da chubu-2023-discretionary-commission.pdf
          check "$(find .chubu-evidence -name '23-zuikei-ukeoi.pdf' -print -quit)" 115261 5471dad9fd1006fc0d252f85e64e56e98af32760f4b1fe84862c592c42f9ea6e chubu-2023-discretionary-goods.pdf

      - name: Register FY2023 sources and exact tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/official-chubu-sources.mjs')
          s=p.read_text()
          imp='import { CHUBU_FY2023_CONTRACT_DOCUMENTS, CHUBU_FY2023_GRANT_DOCUMENTS } from "./official-chubu-fy2023-sources.mjs";\n\n'
          if not s.startswith(imp): s=imp+s
          old='export const CHUBU_GRANT_DOCUMENTS = Object.freeze([\n  makeGrantDocument({'
          new='export const CHUBU_GRANT_DOCUMENTS = Object.freeze([\n  ...CHUBU_FY2023_GRANT_DOCUMENTS,\n  makeGrantDocument({'
          if old not in s: raise SystemExit('grant registration point missing')
          s=s.replace(old,new,1)
          old='export const CHUBU_CONTRACT_DOCUMENTS = Object.freeze([\n  makeCompetitiveContractDocument({'
          new='export const CHUBU_CONTRACT_DOCUMENTS = Object.freeze([\n  ...CHUBU_FY2023_CONTRACT_DOCUMENTS,\n  makeCompetitiveContractDocument({'
          if old not in s: raise SystemExit('contract registration point missing')
          s=s.replace(old,new,1)
          marker='export const CHUBU_COVERAGE_GAPS = Object.freeze([\n'
          addition='''export const CHUBU_COVERAGE_GAPS = Object.freeze([\n  {\n    executorId: "chubu",\n    fiscalYear: 2023,\n    category: "grant_decision",\n    status: "verified_official_period_pair_archive",\n    included: "WARP保存公式目次の実hrefから固定した4月～9月・10月～3月PDF（2資料・224掲載行）",\n    missing: "保存公式目次時点の2資料を検証した範囲であり、年度母集団の完全性は主張しない",\n  },\n  {\n    executorId: "chubu",\n    fiscalYear: 2023,\n    category: "contract_result",\n    status: "verified_official_files_four_categories_archive",\n    included: "WARP保存公式目次の実hrefから固定した競争入札・随意契約の委託費・庁費PDF（4資料・82掲載行）",\n    missing: "保存公式目次時点の4資料を検証した範囲であり、年度母集団の完全性は主張しない",\n  },\n'''
          if marker not in s: raise SystemExit('coverage marker missing')
          s=s.replace(marker,addition,1)
          s=s.replace('included: "令和6年度の交付決定2資料と契約結果4資料",\n    missing: "令和2～5・7年度の交付決定・契約結果、および年度途中の令和8年度",',
                      'included: "令和5・6年度の交付決定4資料と契約結果8資料",\n    missing: "令和2～4・7年度の交付決定・契約結果、および年度途中の令和8年度",',1)
          p.write_text(s)

          p=Path('tests/official-chubu-sources.test.mjs')
          s=p.read_text()
          anchor='const discretionaryEvidenceDirectory = new URL("../evidence/chubu-2024-discretionary/", import.meta.url);\n'
          extra='''const grants2024 = CHUBU_GRANT_DOCUMENTS.filter((document) => document.fiscalYear === 2024);\nconst contracts2024 = CHUBU_CONTRACT_DOCUMENTS.filter((document) => document.fiscalYear === 2024);\nconst grants2023 = CHUBU_GRANT_DOCUMENTS.filter((document) => document.fiscalYear === 2023);\nconst contracts2023 = CHUBU_CONTRACT_DOCUMENTS.filter((document) => document.fiscalYear === 2023);\n'''
          if anchor not in s: raise SystemExit('Chubu test anchor missing')
          s=s.replace(anchor,anchor+extra,1)
          replacements={
            'assert.equal(CHUBU_GRANT_DOCUMENTS.length, 2);':'assert.equal(grants2024.length, 2);',
            'CHUBU_GRANT_DOCUMENTS.reduce((sum, document) =>':'grants2024.reduce((sum, document) =>',
            'CHUBU_GRANT_DOCUMENTS.every((document) => OFFICIAL_DOCUMENTS.includes(document))':'grants2024.every((document) => OFFICIAL_DOCUMENTS.includes(document))',
            'for (const document of CHUBU_GRANT_DOCUMENTS) {':'for (const document of grants2024) {',
            'assert.equal(CHUBU_CONTRACT_DOCUMENTS.length, 4);':'assert.equal(contracts2024.length, 4);',
            'CHUBU_CONTRACT_DOCUMENTS.map((document) => document.id)':'contracts2024.map((document) => document.id)',
            'CHUBU_CONTRACT_DOCUMENTS.map((document) => document.pdfSchema.expectedRecordCount)':'contracts2024.map((document) => document.pdfSchema.expectedRecordCount)',
            'CHUBU_CONTRACT_DOCUMENTS.map((document) => document.pdfSchema.expectedPositionedTextItemCount)':'contracts2024.map((document) => document.pdfSchema.expectedPositionedTextItemCount)',
            'CHUBU_CONTRACT_DOCUMENTS.every((document) => document.pdfSchema.rowAnchorMode === "date")':'contracts2024.every((document) => document.pdfSchema.rowAnchorMode === "date")',
            'CHUBU_CONTRACT_DOCUMENTS.every((document) => document.pdfSchema.expectedBytes > 100_000)':'contracts2024.every((document) => document.pdfSchema.expectedBytes > 100_000)',
            'CHUBU_CONTRACT_DOCUMENTS.every((document) => /^[0-9a-f]{64}$/.test(document.pdfSchema.expectedSha256))':'contracts2024.every((document) => /^[0-9a-f]{64}$/.test(document.pdfSchema.expectedSha256))',
            'CHUBU_CONTRACT_DOCUMENTS.map((document) => document.pdfSchema.recordMapping.methodColumn)':'contracts2024.map((document) => document.pdfSchema.recordMapping.methodColumn)',
            'CHUBU_CONTRACT_DOCUMENTS.filter((document) => document.id.includes("discretionary"))':'contracts2024.filter((document) => document.id.includes("discretionary"))',
            'for (const document of CHUBU_CONTRACT_DOCUMENTS) {':'for (const document of contracts2024) {',
            'const document = CHUBU_GRANT_DOCUMENTS[0];':'const document = grants2024[0];',
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          test_marker='test("registers two FY2024 Chubu grant PDFs with exact individual receipts", () => {'
          new_test='''test("registers and strictly replays six FY2023 Chubu PDFs from exact committed originals", { timeout: 30_000 }, async () => {\n  assert.equal(grants2023.length, 2);\n  assert.equal(contracts2023.length, 4);\n  assert.equal([...grants2023, ...contracts2023].reduce((sum, document) => sum + document.evidenceReceipt.expectedRecordCount, 0), 306);\n  assert.ok([...grants2023, ...contracts2023].every((document) => OFFICIAL_DOCUMENTS.includes(document)));\n  const records = [];\n  for (const document of [...grants2023, ...contracts2023]) {\n    const bytes = await readFile(new URL(`../evidence/official-bootstrap/${document.id}.pdf`, import.meta.url));\n    assert.equal(bytes.length, document.evidenceReceipt.expectedBytes, document.id);\n    assert.equal(createHash("sha256").update(bytes).digest("hex"), document.evidenceReceipt.expectedSha256, document.id);\n    const parsed = await parseOfficialPdf(bytes, document);\n    assert.equal(parsed.length, document.evidenceReceipt.expectedRecordCount, document.id);\n    records.push(...parsed);\n  }\n  assert.equal(records.length, 306);\n  const h2 = records.filter((record) => record.datasetId === "chubu-2023-grant-decisions-h2");\n  assert.deepEqual(h2.filter((record) => !record.organization).map((record) => record.sourceRowNumber), [27, 28, 29]);\n  assert.ok([11, 12, 15, 17].every((ordinal) => !h2.some((record) => record.sourceRowNumber === ordinal)));\n  assert.equal(new Set(records.map((record) => record.id)).size, 306);\n});\n\n'''
          if test_marker not in s: raise SystemExit('FY2024 test marker missing')
          s=s.replace(test_marker,new_test+test_marker,1)
          p.write_text(s)

          p=Path('tests/official-evidence-receipts.test.mjs')
          s=p.read_text()
          old='assert.equal(evidenceDocuments.length, 354); // 320 prior receipts + 33 Kanto FY2021-FY2024 PDFs + 1 Okinawa FY2019 H2 PDF'
          new='assert.equal(evidenceDocuments.length, 360); // prior receipted sources + 6 Chubu FY2023 verified PDFs'
          if old not in s: raise SystemExit('evidence count marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f scripts/chubu-fy2023-trial.mjs

      - name: Prove no prior official row changes and exactly 306 rows are added
        shell: bash
        env:
          OFFICIAL_BOOTSTRAP_EVIDENCE_DIRECTORY: evidence/official-bootstrap
        run: |
          set -euo pipefail
          rm -rf /tmp/chubu-old && mkdir /tmp/chubu-old
          cp data/official/records-*.json /tmp/chubu-old/
          cp data/official/manifest.json /tmp/chubu-old/manifest.json
          npm run update:official
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          const oldFiles=(await readdir('/tmp/chubu-old')).filter((name)=>/^records-.*\.json$/.test(name));
          const old=[]; for(const name of oldFiles) old.push(...JSON.parse(await readFile(`/tmp/chubu-old/${name}`,'utf8')));
          const newFiles=(await readdir('data/official')).filter((name)=>/^records-.*\.json$/.test(name));
          const fresh=[]; for(const name of newFiles) fresh.push(...JSON.parse(await readFile(`data/official/${name}`,'utf8')));
          if(old.length!==17899) throw new Error(`old count ${old.length}`);
          if(fresh.length!==18205) throw new Error(`new count ${fresh.length}`);
          const freshById=new Map(fresh.map((row)=>[row.id,row]));
          let missing=0, changed=0;
          for(const row of old){ const next=freshById.get(row.id); if(!next){missing++;continue;} if(JSON.stringify(next)!==JSON.stringify(row)) changed++; }
          if(missing||changed) throw new Error(`prior rows changed missing=${missing} changed=${changed}`);
          const counts=new Map(); for(const row of fresh){ if(row.datasetId?.startsWith('chubu-2023-')) counts.set(row.datasetId,(counts.get(row.datasetId)||0)+1); }
          const expected={
            'chubu-2023-grant-decisions-h1':170,'chubu-2023-grant-decisions-h2':54,
            'chubu-2023-competitive-commission':7,'chubu-2023-competitive-goods':29,
            'chubu-2023-discretionary-commission':41,'chubu-2023-discretionary-goods':5,
          };
          for(const [id,count] of Object.entries(expected)) if(counts.get(id)!==count) throw new Error(`${id}: ${counts.get(id)}/${count}`);
          const manifest=JSON.parse(await readFile('data/official/manifest.json','utf8'));
          if(manifest.recordCount!==18205 || manifest.coverage.sourceDocumentCount!==434 || manifest.coverage.failedSourceDocumentCount!==0) throw new Error('manifest reconciliation failed');
          console.log('VERIFIED prior=17899 unchanged, added=306, total=18205, documents=434');
          NODE
          npm run test:pages
          git checkout -- data/official

      - name: Commit verified source definitions and exact originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/official-chubu-sources.mjs scripts/official-chubu-fy2023-sources.mjs scripts/official-pdf.mjs tests/official-chubu-sources.test.mjs tests/official-evidence-receipts.test.mjs evidence/official-bootstrap/chubu-2023-*.pdf
          git add -u scripts/chubu-fy2023-trial.mjs
          git commit -m "feat(official): add Chubu FY2023 verified records"
          git push
