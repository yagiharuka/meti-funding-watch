name: Cleanup Chubu temporary workflows
on:
  push:
    paths: [".github/workflows/cleanup-chubu-temp.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Chubu one-off workflow helpers and release trigger
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/workflows/*chubu*.yml)
          if ((${#files[@]})); then
            git rm -- "${files[@]}"
          fi
          git rm --ignore-unmatch tests/.chubu-fy2022-release-trigger
          git status --short
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No Chubu temporary files remain"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(ci): remove Chubu temporary workflows'
          git push
