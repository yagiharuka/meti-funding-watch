name: Update public funding data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "app/**"
      - "pages-site/**"
      - "public/**"
      - "scripts/**"
      - "data/source-registry.json"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.pages.config.ts"
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: funding-data-update
  cancel-in-progress: false

jobs:
  update:
    outputs:
      published_commit: ${{ steps.published.outputs.commit_sha }}
      refresh_outcome: ${{ steps.refresh.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record update attempt time
        id: attempt
        run: echo "attempted_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - name: Refresh official data
        id: refresh
        continue-on-error: true
        run: npm run update:data

      - name: Preserve source snapshot and correction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gbiz-source-evidence-${{ github.run_id }}
          path: .audit/gbiz
          if-no-files-found: warn
          retention-days: 90

      - name: Report refresh failure
        if: steps.refresh.outcome != 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          UPDATE_OUTCOME: failure
          UPDATE_PHASE: official-data-refresh
        run: node scripts/report-update-status.mjs

      - name: Confirm failed refresh did not alter verified data
        if: steps.refresh.outcome != 'success'
        run: |
          if [[ -n "$(git status --porcelain -- data/funding-data.json data/funding-summary.json data/pages)" ]]; then
            echo "::error::Failed refresh altered verified data; refusing to publish a status release."
            exit 1
          fi

      - name: Verify data and GitHub Pages build
        run: npm run test:pages

      - name: Commit changed data
        if: steps.refresh.outcome == 'success'
        run: |
          if git diff --quiet -- data/funding-data.json data/funding-summary.json data/pages; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/funding-data.json data/funding-summary.json data/pages
          git commit -m "chore(data): refresh official funding data"
          git push

      - name: Record the commit included in the public artifact
        id: published
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the artifact from the commit that will be published
        env:
          PAGES_UPDATE_OUTCOME: ${{ steps.refresh.outcome == 'success' && 'succeeded' || 'failed' }}
          PAGES_UPDATE_ATTEMPTED_AT: ${{ steps.attempt.outputs.attempted_at }}
        run: |
          npm run build:pages
          node --test tests/rendered-html.test.mjs

      - name: Package the verified public release
        run: tar -czf pages-release.tgz -C dist-pages .

      - name: Attest the verified public release
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: pages-release.tgz

      - name: Preserve the attested public release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-release-${{ github.run_id }}
          path: pages-release.tgz
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload verified GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist-pages

      - name: Report publication preparation failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          UPDATE_OUTCOME: failure
          UPDATE_PHASE: publication-preparation
          FAILURE_REASON: GitHub Pagesの検証・公開準備に失敗
        run: node scripts/report-update-status.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Check out status reporter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy the artifact verified in this workflow
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 600000

      - name: Verify the published release from the live site
        id: verify
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_OUTCOME: ${{ needs.update.outputs.refresh_outcome == 'success' && 'succeeded' || 'failed' }}
          EXPECTED_COMMIT: ${{ needs.update.outputs.published_commit }}
        run: node scripts/verify-live-pages.mjs

      - name: Report verified publication success
        if: needs.update.outputs.refresh_outcome == 'success' && steps.deployment.outcome == 'success' && steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          UPDATE_OUTCOME: success
          UPDATE_PHASE: live-publication-verification
        run: node scripts/report-update-status.mjs

      - name: Report publication or verification failure
        if: always() && (steps.deployment.outcome != 'success' || steps.verify.outcome != 'success')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          UPDATE_OUTCOME: failure
          UPDATE_PHASE: live-publication-verification
          FAILURE_REASON: GitHub Pagesの公開または公開後検証に失敗
        run: node scripts/report-update-status.mjs

      - name: Fail the workflow unless a fresh release was verified
        if: always()
        env:
          REFRESH_OUTCOME: ${{ needs.update.outputs.refresh_outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [[ "$REFRESH_OUTCOME" != "success" || "$DEPLOY_OUTCOME" != "success" || "$VERIFY_OUTCOME" != "success" ]]; then
            echo "::error::A fresh verified release was not published."
            exit 1
          fi
