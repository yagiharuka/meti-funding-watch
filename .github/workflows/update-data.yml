name: Update public funding data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "app/**"
      - "pages-site/**"
      - "public/**"
      - "scripts/**"
      - "data/source-registry.json"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.pages.config.ts"
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: funding-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh official data
        run: npm run update:data

      - name: Verify data and production build
        run: npm test

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/funding-data.json data/funding-summary.json data/pages; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/funding-data.json data/funding-summary.json data/pages
          git commit -m "chore(data): refresh official funding data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy the artifact verified in this workflow
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
