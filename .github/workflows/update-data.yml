name: Update public funding data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "app/**"
      - "pages-site/**"
      - "public/**"
      - "scripts/**"
      - "data/source-registry.json"
      - "data/approved-gbiz-corrections.json"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.pages.config.ts"
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: funding-data-update
  cancel-in-progress: false

jobs:
  update:
    outputs:
      published_sha: ${{ steps.published.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh official data
        id: refresh
        continue-on-error: ${{ github.event_name == 'push' }}
        run: npm run update:data

      - name: Preserve source snapshot and correction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gbiz-source-evidence-${{ github.run_id }}
          path: .audit/gbiz
          if-no-files-found: warn
          retention-days: 90

      - name: Report refresh status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: node scripts/report-update-status.mjs

      - name: Stop publication after refresh failure
        if: steps.refresh.outcome != 'success'
        run: |
          echo "::error::Official data refresh failed; verified stale data will not be redeployed."
          exit 1

      - name: Verify data and production build
        run: npm test

      - name: Commit changed data
        if: steps.refresh.outcome == 'success'
        run: |
          if git diff --quiet -- data/funding-data.json data/funding-summary.json data/pages; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/funding-data.json data/funding-summary.json data/pages
          git commit -m "chore(data): refresh official funding data"
          git push

      - name: Record the commit that will be published
        id: published
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the artifact from the commit that will be published
        run: |
          npm run build:pages
          node --test tests/rendered-html.test.mjs

      - name: Package the verified public release
        run: tar -czf pages-release.tgz -C dist-pages .

      - name: Attest the verified public release
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: pages-release.tgz

      - name: Preserve the attested public release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-release-${{ github.run_id }}
          path: pages-release.tgz
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload verified GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy the artifact verified in this workflow
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 600000

  sync-search:
    runs-on: ubuntu-latest
    needs: [update, deploy]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Sync the verified release to the server-side search index
        env:
          EXPECTED_COMMIT: ${{ needs.update.outputs.published_sha }}
        run: |
          response=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meti-funding-watch-sync")
          OIDC_TOKEN=$(echo "$response" | jq -r .value)
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          curl -fsSL --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"expectedCommit\":\"${EXPECTED_COMMIT}\"}" \
            https://meti-funding-watch.haru620328.chatgpt.site/api/funding/sync
