name: Publish verified funding data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "app/**"
      - "pages-site/**"
      - "public/**"
      - "scripts/**"
      - "data/source-registry.json"
      - "data/official-source-registry.json"
      - "data/official-reconciliation.json"
      - "data/official/**"
      - "data/official-supplement-seeds.json"
      - "data/official-supplement-jetro.json"
      - "data/official-supplement-aist.json"
      - "data/official-supplement-inpit.json"
      - "data/official-supplement-index.json"
      - "data/funding-data.json"
      - "data/funding-summary.json"
      - "data/pages/**"
      - "data/review-cache/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.pages.config.ts"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "mainの検証済みデータだけを公開する（外部取得は行わない）"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: funding-data-publication
  # 15分差の系列更新が重なった場合は、古い公開を止めて最新mainだけを公開する。
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
      attestations: write
    outputs:
      published_commit: ${{ steps.published.outputs.commit_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record publication attempt time
        id: attempt
        run: echo "attempted_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - name: Verify committed data and GitHub Pages build
        run: npm run test:pages

      - name: Record the commit included in the public artifact
        id: published
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the artifact from the commit that will be published
        env:
          PAGES_UPDATE_OUTCOME: unknown
          PAGES_UPDATE_ATTEMPTED_AT: ${{ steps.attempt.outputs.attempted_at }}
        run: |
          npm run build:pages
          node --test tests/rendered-html.test.mjs

      - name: Package the verified public release
        run: tar -czf pages-release.tgz -C dist-pages .

      - name: Attest the verified public release
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: pages-release.tgz

      - name: Preserve the attested public release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-release-${{ github.run_id }}
          path: pages-release.tgz
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload verified GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist-pages

      - name: Report publication preparation failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          UPDATE_OUTCOME: failure
          UPDATE_PHASE: publication-preparation
          FAILURE_REASON: GitHub Pagesの検証・公開準備に失敗
        run: node scripts/report-update-status.mjs

  deploy:
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Check out status reporter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy the artifact verified in this workflow
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 600000

      - name: Verify the published release from the live site
        id: verify
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_OUTCOME: unknown
          EXPECTED_COMMIT: ${{ needs.publish.outputs.published_commit }}
        run: node scripts/verify-live-pages.mjs

      - name: Report verified publication success
        if: steps.deployment.outcome == 'success' && steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          UPDATE_OUTCOME: success
          UPDATE_PHASE: live-publication-verification
        run: node scripts/report-update-status.mjs

      - name: Report publication or verification failure
        if: always() && (steps.deployment.outcome != 'success' || steps.verify.outcome != 'success')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          UPDATE_OUTCOME: failure
          UPDATE_PHASE: live-publication-verification
          FAILURE_REASON: GitHub Pagesの公開または公開後検証に失敗
        run: node scripts/report-update-status.mjs

      - name: Fail the workflow unless the verified release is live
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [[ "$DEPLOY_OUTCOME" != "success" || "$VERIFY_OUTCOME" != "success" ]]; then
            echo "::error::A fresh verified release was not published."
            exit 1
          fi
