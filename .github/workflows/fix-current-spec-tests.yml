# This workflow is temporary and deletes itself after a verified repair.
# retriggered 2026-08-20T00:49+09:00 after aligning the final governance assertion.
name: Repair current-spec tests and publish Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-current-spec-tests.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: repair-current-spec-and-publish
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Record the repair run on the existing publication alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 20 --repo "$GITHUB_REPOSITORY" --body "サイト再公開の修正処理を開始しました。\n\n- 実行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n- 対象: 2021年度以降の公式補足と企業統合検索\n- 処理: 全Pages検証 → main反映 → Pages公開 → ライブ照合"

  repair-and-publish:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Align stale assertions with the current verified specification
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(before, after), encoding="utf-8")

          replace_once(
              "tests/funding-data.test.mjs",
              "  assert.doesNotMatch(recordsSection, /合計|交付金額|期間指定API/);",
              "  assert.match(recordsSection, /GビズINFO掲載値合計/);\n  assert.match(recordsSection, /総支出額ではありません/);\n  assert.doesNotMatch(recordsSection, /交付金額|期間指定API|総支出額合計/);",
          )
          replace_once(
              "tests/funding-data.test.mjs",
              "  assert.match(viewTabsSource, /調達（委託を含む）・補助金/);",
              "  assert.match(viewTabsSource, /企業検索/);\n  assert.match(viewTabsSource, /GビズINFO＋行政事業レビューを同時表示/);",
          )
          replace_once(
              "tests/governance.test.mjs",
              "  assert.doesNotMatch(official, /gh workflow run update-data\\.yml/);",
              "  assert.match(official, /GITHUB_TOKENで作ったbot commitはpush workflowを起動しない/);\n  assert.match(official, /if: steps\\.commit_data\\.outputs\\.changed == 'true'/);\n  assert.match(official, /gh workflow run update-data\\.yml --ref main -f publish_only=true/);",
          )
          replace_once(
              "tests/rendered-html.test.mjs",
              "    name === \"manifest.json\" || name === \"review\" || name === \"commitments-preview.json\" || /^commitments-(?:\\d{4}|unclassified)\\.json$/.test(name)));",
              "    name === \"manifest.json\" || name === \"review\" || name === \"review-company-index.json\" || name === \"commitments-preview.json\" || /^commitments-(?:\\d{4}|unclassified)\\.json$/.test(name)));",
          )
          replace_once(
              "tests/review-ui-semantics.test.mjs",
              "  assert.match(reviewSearchSource, /NEDOから先を見る/);\n  assert.match(reviewSearchSource, /NEDOが直接の支出元として記載された支出先/);",
              "  assert.match(reviewSearchSource, /支出先企業を検索する欄と、資金経路上の支出元を絞る欄を分けています/);\n  assert.match(reviewSearchSource, /資金経路で絞る（例：NEDO・中小機構）/);\n  assert.match(reviewSearchSource, /\\[\"NEDO\", \"IPA\", \"中小機構\", \"JOGMEC\", \"JETRO\"\\]/);\n  assert.match(reviewSearchSource, /\\{name\\}を経由/);\n  assert.match(reviewSearchSource, /NEDOや中小機構などが資金経路の途中にある案件/);",
          )
          replace_once(
              "data/official-supplement-seeds.json",
              "公式補足は、経済産業省本省・NEDO・中小企業基盤整備機構について、受取先と金額を確認できた公表情報だけを表示する。各機関の全制度・全契約を網羅するものではなく、GビズINFO掲載値や行政事業レビュー支出額とは合算しない。",
              "公式補足は、経済産業省本省・NEDO・中小企業基盤整備機構について、2021年度以降を基本対象とし、受取先と金額を確認できた公表情報だけを表示する。機関ごとに実際の収録開始年度は異なる。各機関の全制度・全契約を網羅するものではなく、GビズINFO掲載値や行政事業レビュー支出額とは合算しない。",
          )
          PY
          rm -f .fix-current-spec-tests-trigger
          git rm .github/workflows/fix-current-spec-tests.yml

      - name: Install dependencies
        run: npm ci

      - name: Verify the complete Pages release before committing
        run: npm run test:pages

      - name: Commit only verified repair changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/funding-data.test.mjs \
            tests/governance.test.mjs \
            tests/rendered-html.test.mjs \
            tests/review-ui-semantics.test.mjs \
            data/official-supplement-seeds.json \
            data/official-supplement-index.json \
            .fix-current-spec-tests-trigger \
            .github/workflows/fix-current-spec-tests.yml
          git commit -m "現行の企業統合検索仕様に検証を整合"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push raced; retrying ($attempt/3)."
          done
          exit 1

      - name: Rebuild the artifact from the committed repair
        env:
          PAGES_UPDATE_OUTCOME: unknown
          PAGES_UPDATE_ATTEMPTED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build:pages
          node --test tests/rendered-html.test.mjs tests/official-supplement.test.mjs

      - name: Package the verified public release
        run: tar -czf pages-release.tgz -C dist-pages .

      - name: Attest the verified public release
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: pages-release.tgz

      - name: Preserve the verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repaired-pages-release-${{ github.run_id }}
          path: pages-release.tgz
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload verified GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist-pages

      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 600000

      - name: Verify the live release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_OUTCOME: unknown
          EXPECTED_COMMIT: ${{ steps.commit.outputs.commit_sha }}
        run: node scripts/verify-live-pages.mjs

      - name: Close the stale publication alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          UPDATE_OUTCOME: success
          UPDATE_PHASE: live-publication-verification
        run: node scripts/report-update-status.mjs
