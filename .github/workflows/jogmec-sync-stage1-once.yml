name: One-time publish safe JOGMEC stage-one rows

on:
  push:
    branches:
      - reingest/jogmec-full-history
    paths:
      - ".github/workflows/jogmec-sync-stage1-once.yml"

permissions:
  contents: write

concurrency:
  group: one-time-jogmec-safe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reingest/jogmec-full-history
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild inventory and strict stage-one records
        run: |
          mkdir -p .audit
          node scripts/jogmec-inventory-20260826.mjs
          node scripts/jogmec-reingest-stage1-20260826.mjs
          node --test tests/jogmec-reingest-stage1.test.mjs
      - name: Sync only index-compatible rows without zero-filling
        run: node scripts/sync-jogmec-stage1-to-seeds-20260826.mjs
      - name: Rebuild existing indexes and run the repository suite
        run: |
          node scripts/build-official-supplement-index.mjs
          node scripts/build-official-company-index.mjs
          npm test
      - name: Validate published and audit-only accounting
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const data = JSON.parse(await readFile("data/official-supplement-jogmec.json", "utf8"));
          const seeds = JSON.parse(await readFile("data/official-supplement-seeds.json", "utf8"));
          const supplement = JSON.parse(await readFile("data/official-supplement-index.json", "utf8"));
          const source = seeds.sources.find((entry) => entry.id === "jogmec");
          const indexed = supplement.records.filter((row) => row.sourceId === "jogmec");
          if (!source) throw new Error("JOGMEC source missing");
          if (source.records.length !== indexed.length) throw new Error(`index mismatch: ${source.records.length}/${indexed.length}`);
          if (source.records.length < data.priorRecordCount) throw new Error(`published rows regressed: ${source.records.length}/${data.priorRecordCount}`);
          const auditOnly = data.records.filter((row) => row.amount === null && row.category !== "implementation_decision").length;
          if (source.indexExcludedNullContractCount !== auditOnly) throw new Error(`audit-only count mismatch: ${source.indexExcludedNullContractCount}/${auditOnly}`);
          for (const row of source.records) {
            if (row.amount === 0 && /記載なし|非公表|単価|個社別/u.test(row.amountStage)) throw new Error(`zero-filled row: ${row.id}`);
          }
          console.log(JSON.stringify({
            collectionStatus: data.collectionStatus,
            resultCandidateCount: data.resultCandidateCount,
            parsedDocumentCount: data.parsedDocumentCount,
            unparsedDocumentCount: data.unparsedDocumentCount,
            newlyParsedRecordCount: data.newlyParsedRecordCount,
            retainedAuditRecords: data.recordCount,
            publishedIndexRecords: source.records.length,
            auditOnlyNullContractRecords: auditOnly,
          }));
          NODE
      - name: Commit verified stage-one data and remove temporary workflows
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -e .github/workflows/jogmec-inventory-once.yml || git rm .github/workflows/jogmec-inventory-once.yml
          test ! -e .github/workflows/jogmec-stage1-once.yml || git rm .github/workflows/jogmec-stage1-once.yml
          test ! -e .github/workflows/jogmec-integrate-once.yml || git rm .github/workflows/jogmec-integrate-once.yml
          git rm .github/workflows/jogmec-sync-stage1-once.yml
          test ! -e scripts/apply-jogmec-stage1-integration-20260826.mjs || git rm scripts/apply-jogmec-stage1-integration-20260826.mjs
          git add \
            scripts/jogmec-inventory-20260826.mjs \
            scripts/jogmec-reingest-stage1-20260826.mjs \
            scripts/sync-jogmec-stage1-to-seeds-20260826.mjs \
            tests/jogmec-reingest-stage1.test.mjs \
            data/official-supplement-jogmec-inventory.json \
            data/official-supplement-jogmec.json \
            data/official-supplement-seeds.json \
            data/official-supplement-index.json \
            public/data/official-company-index.json \
            .audit/jogmec-inventory.json \
            .audit/jogmec-reingest-stage1.json
          git commit -m "feat(data): publish verified JOGMEC result rows"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git pull --rebase origin reingest/jogmec-full-history
            if git push origin HEAD:reingest/jogmec-full-history; then
              exit 0
            fi
            echo "Push raced; retrying ($attempt/3)."
          done
          exit 1
