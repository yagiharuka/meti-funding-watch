name: Validate combined company search

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-combined-company-search.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Validate generated files
        run: |
          test -s dist-pages/data/review-company-index.json
          grep -q '企業検索' dist-pages/index.html
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('dist-pages/data/review-company-index.json','utf8')); if(x.schemaVersion!==1 || !Array.isArray(x.recipients) || !x.recipients.length) process.exit(1); fs.mkdirSync('data/audits',{recursive:true}); fs.writeFileSync('data/audits/combined-search-build-validation.json', JSON.stringify({validatedAt:new Date().toISOString(), recipientCount:x.recipients.length, reviewSheetYears:x.reviewSheetYears, status:'passed'}, null, 2)+'\n')"
      - name: Commit validation receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/combined-search-build-validation.json
          git commit -m "企業同時検索の公開ビルドを検証" || exit 0
          git push
