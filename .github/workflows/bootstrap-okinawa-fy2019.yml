name: Bootstrap Okinawa FY2019 H2 evidence

on:
  push:
    paths:
      - ".github/workflows/bootstrap-okinawa-fy2019.yml"

permissions:
  actions: read
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact audited source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .audit/recovered evidence/official-bootstrap
          gh api repos/${{ github.repository }}/actions/artifacts/9212326868/zip > .audit/okinawa-audit.zip
          unzip -q .audit/okinawa-audit.zip -d .audit/recovered
          src=.audit/recovered/2019-31fyhojoshimoki.pdf
          test "$(stat -c %s "$src")" = "50170"
          echo "cc0dee7fffdc496913a88ef241f3b572f87560e7f98b32077cd3ac7f329621b3  $src" | sha256sum -c -
          cp "$src" evidence/official-bootstrap/okinawa-2019-grant-decisions-h2.pdf
      - name: Commit bootstrap evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/official-bootstrap/okinawa-2019-grant-decisions-h2.pdf
          git diff --cached --quiet && exit 0
          git commit -m "data(official): pin Okinawa FY2019 H2 bootstrap evidence"
          git push origin HEAD:main
