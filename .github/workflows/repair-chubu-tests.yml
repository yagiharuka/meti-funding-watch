name: Repair Chubu regression test
on:
  push:
    paths: [".github/workflows/repair-chubu-tests.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore verified FY2023 test and add FY2022 replay only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 63dc170c3e93d8da142c5b27538c5ccaef20f7a6
          git show 63dc170c3e93d8da142c5b27538c5ccaef20f7a6:tests/official-chubu-sources.test.mjs > tests/official-chubu-sources.test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/official-chubu-sources.test.mjs')
          s=p.read_text()
          s=s.replace('// Release trigger after verified Chubu FY2023 integration.','// Release trigger after verified Chubu FY2022 integration.',1)
          anchor='const grants2023 = CHUBU_GRANT_DOCUMENTS.filter((document) => document.fiscalYear === 2023);\nconst contracts2023 = CHUBU_CONTRACT_DOCUMENTS.filter((document) => document.fiscalYear === 2023);\n'
          add=anchor+'const grants2022 = CHUBU_GRANT_DOCUMENTS.filter((document) => document.fiscalYear === 2022);\nconst contracts2022 = CHUBU_CONTRACT_DOCUMENTS.filter((document) => document.fiscalYear === 2022);\n'
          if anchor not in s: raise SystemExit('FY2023 constants anchor missing')
          s=s.replace(anchor,add,1)
          marker='test("registers and strictly replays six FY2023 Chubu PDFs from exact committed originals"'
          test='''test("registers and strictly replays six FY2022 Chubu PDFs from exact committed originals", { timeout: 30000 }, async () => {\n  assert.equal(grants2022.length, 2);\n  assert.equal(contracts2022.length, 4);\n  const records = [];\n  for (const document of [...grants2022, ...contracts2022]) {\n    const bytes = await readFile(new URL(`../evidence/official-bootstrap/${document.id}.pdf`, import.meta.url));\n    const parsed = await parseOfficialPdf(bytes, document);\n    assert.equal(parsed.length, document.evidenceReceipt.expectedRecordCount);\n    records.push(...parsed);\n  }\n  assert.equal(records.length, 268);\n});\n\n'''
          if marker not in s: raise SystemExit('FY2023 test anchor missing')
          s=s.replace(marker,test+marker,1)
          p.write_text(s)
          PY
      - name: Verify targeted and full Pages suite
        run: |
          node --test tests/official-chubu-sources.test.mjs
          npm run test:pages
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/official-chubu-sources.test.mjs
          git commit -m 'test(official): restore Chubu regression coverage'
          git push
