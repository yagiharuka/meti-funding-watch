name: Audit Chubu FY2019 workbooks
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-workbooks.yml"]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned historical source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31861177297 -n chubu-fy2019-2021-audit-31861177297 -D .audit-chubu-hist
      - name: Install audit-only workbook readers
        run: python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
      - name: Inspect all FY2019 workbook cells
        shell: bash
        run: |
          mkdir -p .audit-chubu-fy2019
          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path
          import openpyxl
          import xlrd

          root=Path('.audit-chubu-hist/files')
          wanted=[
            '05__r1fy-4-9hojyokin.xlsx','06__r1fy-10-3hojyokin.xlsx',
            '11__19_nyusatsu_itaku.xlsx','12__19-ukeoi.xlsx',
            '17__19-zuikei-itaku.xls','18__19-zuikei-ukeoi.xls',
          ]
          out=[]
          def serial(value):
              if isinstance(value,(datetime,date)): return {'kind':'date','value':value.isoformat()}
              if isinstance(value,(str,int,float,bool)) or value is None: return value
              return {'kind':type(value).__name__,'value':str(value)}
          for name in wanted:
              path=root/name
              item={'filename':name,'bytes':path.stat().st_size,'sheets':[]}
              if name.endswith('.xlsx'):
                  wb=openpyxl.load_workbook(path,read_only=False,data_only=False)
                  for ws in wb.worksheets:
                      rows=[]; formulas=[]
                      for r in range(1,ws.max_row+1):
                          cells=[]
                          for c in range(1,ws.max_column+1):
                              cell=ws.cell(r,c)
                              if cell.value is None: continue
                              cells.append({'column':c,'coordinate':cell.coordinate,'value':serial(cell.value),'dataType':cell.data_type,'numberFormat':cell.number_format})
                              if cell.data_type=='f': formulas.append(cell.coordinate)
                          if cells: rows.append({'row':r,'cells':cells})
                      item['sheets'].append({'name':ws.title,'maxRow':ws.max_row,'maxColumn':ws.max_column,'dimension':ws.calculate_dimension(),'mergedRanges':[str(x) for x in ws.merged_cells.ranges],'formulas':formulas,'rows':rows})
                  wb.close()
              else:
                  wb=xlrd.open_workbook(path,formatting_info=True,on_demand=False)
                  item['datemode']=wb.datemode
                  for ws in wb.sheets():
                      rows=[]
                      for r in range(ws.nrows):
                          cells=[]
                          for c in range(ws.ncols):
                              cell=ws.cell(r,c)
                              if cell.ctype in (xlrd.XL_CELL_EMPTY,xlrd.XL_CELL_BLANK): continue
                              value=cell.value
                              if cell.ctype==xlrd.XL_CELL_DATE:
                                  value={'kind':'date','value':xlrd.xldate_as_datetime(value,wb.datemode).isoformat()}
                              else: value=serial(value)
                              cells.append({'column':c+1,'coordinate':f'R{r+1}C{c+1}','value':value,'cellType':cell.ctype})
                          if cells: rows.append({'row':r+1,'cells':cells})
                      item['sheets'].append({'name':ws.name,'maxRow':ws.nrows,'maxColumn':ws.ncols,'mergedRanges':[list(x) for x in ws.merged_cells],'rows':rows})
              out.append(item)
          Path('.audit-chubu-fy2019/workbooks.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          for item in out:
              print(f"FILE {item['filename']} bytes={item['bytes']}")
              for sheet in item['sheets']:
                  nonempty=sheet['rows']; first=nonempty[0]['row'] if nonempty else None; last=nonempty[-1]['row'] if nonempty else None
                  print(f"  SHEET {sheet['name']!r} size={sheet['maxRow']}x{sheet['maxColumn']} nonempty={len(nonempty)} first={first} last={last} merged={len(sheet['mergedRanges'])}")
                  for row in nonempty[:12]: print('   ',row['row'],[(c['column'],c['value']) for c in row['cells']])
                  if len(nonempty)>20: print('    ...')
                  for row in nonempty[-8:]:
                      if row not in nonempty[:12]: print('   ',row['row'],[(c['column'],c['value']) for c in row['cells']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chubu-fy2019-workbook-audit-${{ github.run_id }}
          path: .audit-chubu-fy2019
          retention-days: 14
