name: Audit Chubu FY2022 sources

on:
  push:
    paths:
      - ".github/workflows/audit-chubu-fy2022.yml"
      - "scripts/audit-chubu-fy2022.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch saved official index and its exact six FY2022 PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit-chubu-2022
          index_url='https://warp.ndl.go.jp/20260613/20260601101404/https://www.chubu.meti.go.jp/a41kaikei/kouhyou/index.html'
          jar=/tmp/warp.cookies
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          get() {
            local url="$1" out="$2"
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl --fail --location --compressed --connect-timeout 20 --max-time 120 \
                -A "$ua" -e "$index_url" -c "$jar" -b "$jar" \
                -H 'Accept: application/pdf,text/html;q=0.9,*/*;q=0.8' \
                "$url" -o "$out"; then return 0; fi
              rm -f "$out"
              sleep $((attempt * 8))
              curl --location --compressed --connect-timeout 20 --max-time 60 -A "$ua" -c "$jar" -b "$jar" "$index_url" -o /tmp/warp-index-refresh.html || true
            done
            return 1
          }
          curl --fail --location --compressed --connect-timeout 20 --max-time 120 -A "$ua" -c "$jar" -b "$jar" "$index_url" -o .audit-chubu-2022/index.html
          python - <<'PY' > /tmp/fy2022-hrefs.tsv
          from pathlib import Path
          import re
          html=Path('.audit-chubu-2022/index.html').read_text(errors='replace')
          expected=['r4fy_4-9.pdf','r4fy_10-3.pdf','22-nyusatsu-itaku.pdf','22-ukeoi.pdf','22-zuikei-itaku.pdf','22-zuikei-ukeoi.pdf']
          hrefs=re.findall(r'href=["\']([^"\']+)["\']', html, flags=re.I)
          for name in expected:
              matches=[h for h in hrefs if h.endswith('/'+name) or h.endswith(name)]
              if len(matches)!=1: raise SystemExit(f'{name}: expected one href, got {matches}')
              href=matches[0]
              url=href if href.startswith('http') else 'https://warp.ndl.go.jp'+href
              print(name+'\t'+url)
          PY
          while IFS=$'\t' read -r name url; do
            echo "FETCH $name $url"
            get "$url" ".audit-chubu-2022/$name"
            head -c 5 ".audit-chubu-2022/$name" | grep -q '%PDF-'
            sleep 6
          done < /tmp/fy2022-hrefs.tsv
      - name: Verify exact first-audit byte receipts
        shell: bash
        run: |
          set -euo pipefail
          check(){ f="$1" bytes="$2" sha="$3"; test "$(wc -c < ".audit-chubu-2022/$f")" -eq "$bytes"; test "$(sha256sum ".audit-chubu-2022/$f"|cut -d' ' -f1)" = "$sha"; }
          check r4fy_4-9.pdf 393052 8eae0800f65273cc3543d61dcc5a45c677e490b6f0b394cc401ec7d642667670
          check r4fy_10-3.pdf 135918 a2710a4ca4ab2307576721342aaacff6d611a95905a7061902c2caee6738fba2
          check 22-nyusatsu-itaku.pdf 135508 84d958e5847a5e0864d6fcc6142745f7b2e444c3cacab72caf9853f0457816c1
          check 22-ukeoi.pdf 183778 8fc64f358cfaa8509f927d5299cb6ae88944b4e7d9a0c19a1aa5265e30d7cd72
          check 22-zuikei-itaku.pdf 222222 bc41295700790dd6b421ad08e77809dbd81a81f52d87b9c62f48cf3ba7ab2bdb
          check 22-zuikei-ukeoi.pdf 90326 c33b9b5da9987937aa7909ef313441baca4aa38fc10d5f200645fc4efb727c45
      - name: Inspect exact PDF structure
        run: node scripts/audit-chubu-fy2022.mjs .audit-chubu-2022
      - name: Preserve audited originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chubu-fy2022-audit-${{ github.run_id }}
          path: |
            .audit-chubu-2022/*.pdf
            .audit-chubu-2022/index.html
          include-hidden-files: true
          retention-days: 90
