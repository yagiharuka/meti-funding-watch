name: Export Chubu staging payload
on:
  push:
    paths: [".github/workflows/export-chubu-staging.yml"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Diagnose payload text
        run: |
          wc -c .openai/chubu-history-changes.b64
          python - <<'PY'
          from pathlib import Path
          s=Path('.openai/chubu-history-changes.b64').read_text()
          allowed=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n')
          invalid=[(i,ch) for i,ch in enumerate(s) if ch not in allowed]
          print('characters',len(s),'invalid_count',len(invalid),'first_invalid',invalid[:20])
          print('head',repr(s[:80]))
          print('tail',repr(s[-80:]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chubu-staging-payload-${{ github.run_id }}
          path: .openai/chubu-history-changes.b64
          retention-days: 3
