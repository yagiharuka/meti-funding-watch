name: Fix Chubu FY2020-FY2021 layouts
on:
  push:
    paths: [".github/workflows/fix-chubu-fy2020-2021-layouts.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-derived page row receipts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/official-chubu-fy2020-2021-sources.mjs')
          s=p.read_text()
          replacements={
            'expectedRowsPerPage: [29, 26, 31, 32, 26, 26, 27, 23]': 'expectedRowsPerPage: [26, 26, 27, 36, 26, 26, 26, 27]',
            'expectedRowsPerPage: [...Array(16).fill(14), 2]': 'expectedRowsPerPage: [12, ...Array(15).fill(14), 4]',
          }
          for a,b in replacements.items():
              assert a in s, a
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
          node --check scripts/official-chubu-fy2020-2021-sources.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/official-chubu-fy2020-2021-sources.mjs
          git commit -m 'fix(official): pin historical Chubu page row counts'
          git push