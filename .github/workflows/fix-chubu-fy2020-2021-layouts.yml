name: Fix Chubu FY2020-FY2021 layouts
on:
  push:
    paths: [".github/workflows/fix-chubu-fy2020-2021-layouts.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-derived FY2021 H2 header receipt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/official-chubu-fy2020-2021-sources.mjs'); s=p.read_text()
          a='["jurisdictionClass", ["国所管、都道府県", "国所管、"]],'
          b='["jurisdictionClass", ["国所管、都道府県", "国所管、", "県所管の区分"]],'
          assert a in s
          p.write_text(s.replace(a,b,1))
          PY
          node --check scripts/official-chubu-fy2020-2021-sources.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/official-chubu-fy2020-2021-sources.mjs
          git commit -m 'fix(official): pin FY2021 H2 jurisdiction header'
          git push