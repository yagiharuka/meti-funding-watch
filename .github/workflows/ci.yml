name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify misreading catalog passage
        run: node scripts/check-misreading-catalog-pr.mjs

      - name: Verify repository hygiene
        run: node scripts/check-repository-hygiene.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify committed official supplement index
        run: |
          node scripts/build-official-supplement-index.mjs
          git diff --exit-code -- data/official-supplement-index.json

      - name: Lint
        run: npm run lint

      - name: Build and test with repository fixtures
        run: npm test

  reingest_nedo_once:
    if: github.event_name == 'pull_request' && github.head_ref == 'reingest/nedo-dtsu-gx-full'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reingest, rebuild and validate while preserving evidence
        id: reingest
        shell: bash
        run: |
          mkdir -p .audit
          status=0
          {
            echo "== NEDO DTSU/GX live reingest =="
            node scripts/nedo-official-supplement.mjs || status=$?
            if [ "$status" -eq 0 ]; then
              echo "== Rebuild combined official supplement index =="
              node scripts/build-official-supplement-index.mjs || status=$?
            fi
            if [ "$status" -eq 0 ]; then
              echo "== Regression tests =="
              node --test tests/nedo-official-supplement.test.mjs tests/official-supplement.test.mjs || status=$?
            fi
            if [ "$status" -eq 0 ]; then
              echo "== Row accounting =="
              node --input-type=module -e '
                import { readFile } from "node:fs/promises";
                const data = JSON.parse(await readFile("data/official-supplement-nedo.json", "utf8"));
                if (data.parseFailureCount !== 0) throw new Error(`parse failures: ${data.parseFailureCount}`);
                if (data.listingCount !== data.parsedCount + data.amountUnavailableCount) {
                  throw new Error(`row accounting mismatch: ${data.parsedCount}+${data.amountUnavailableCount}/${data.listingCount}`);
                }
                if (data.records.length < 40) throw new Error(`too few retained records: ${data.records.length}`);
                console.log(JSON.stringify({ listingCount: data.listingCount, parsedCount: data.parsedCount, amountUnavailableCount: data.amountUnavailableCount, retainedRecords: data.records.length }));
              ' || status=$?
            fi
            echo "exitStatus=$status"
          } > .audit/nedo-dtsu-gx-reingest.log 2>&1
          cat .audit/nedo-dtsu-gx-reingest.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit the live result and restore ordinary CI
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml .audit/nedo-dtsu-gx-reingest.log
          if [ "${{ steps.reingest.outputs.status }}" -eq 0 ]; then
            git add data/official-supplement-nedo.json data/official-supplement-index.json
          fi
          git commit -m "chore(data): record NEDO DTSU and GX full reingest"
          for attempt in 1 2 3; do
            git pull --rebase origin reingest/nedo-dtsu-gx-full
            if git push origin HEAD:reingest/nedo-dtsu-gx-full; then
              exit 0
            fi
            echo "Push raced; retrying ($attempt/3)."
          done
          exit 1

      - name: Fail after preserving evidence when the live reingest is invalid
        if: steps.reingest.outputs.status != '0'
        run: exit 1
