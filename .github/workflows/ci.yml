name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify misreading catalog passage
        run: node scripts/check-misreading-catalog-pr.mjs

      - name: Verify repository hygiene
        run: node scripts/check-repository-hygiene.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify committed official supplement index
        run: |
          node scripts/build-official-supplement-index.mjs
          git diff --exit-code -- data/official-supplement-index.json

      - name: Lint
        run: npm run lint

      - name: Build and test with repository fixtures
        run: npm test

  inventory_jogmec_sources_once:
    if: github.event_name == 'pull_request' && github.head_ref == 'reingest/jogmec-full-history'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the JOGMEC reingest branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inventory official JOGMEC result sources
        run: node scripts/diagnose-jogmec-official-sources.mjs

      - name: Preserve the source inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jogmec-source-discovery-${{ github.run_id }}
          path: .audit/jogmec-discovery
          if-no-files-found: error
          retention-days: 90

      - name: Commit the inventory and restore ordinary CI
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/jogmec-discovery-once.yml scripts/diagnose-jogmec-official-sources.mjs
          git add -f .audit/jogmec-discovery
          git add docs/jogmec-reingest-plan.md .github/workflows/ci.yml
          git commit -m "audit: inventory JOGMEC official result sources"
          for attempt in 1 2 3; do
            git pull --rebase origin reingest/jogmec-full-history
            if git push origin HEAD:reingest/jogmec-full-history; then
              exit 0
            fi
            echo "Push raced; retrying ($attempt/3)."
          done
          exit 1
