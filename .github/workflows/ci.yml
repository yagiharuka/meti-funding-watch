name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

# Temporary write permission on this maintenance branch only. This is removed
# after the stale committed official supplement index has been regenerated.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify misreading catalog passage
        run: node scripts/check-misreading-catalog-pr.mjs

      - name: Verify repository hygiene
        run: node scripts/check-repository-hygiene.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test with repository fixtures
        run: npm test

      - name: Bootstrap stale committed official supplement index
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/monthly-official-refresh-20260824'
        run: |
          if git diff --quiet -- data/official-supplement-index.json; then
            echo "Committed official supplement index is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official-supplement-index.json
          git commit -m "chore(data): synchronize official supplement index"
          git push origin HEAD:${{ github.head_ref }}
