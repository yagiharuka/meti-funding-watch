name: Discover legacy review sources

on:
  push:
    branches: [main]
    paths:
      - scripts/discover-legacy-review-sources.mjs
      - .github/workflows/discover-legacy-review-sources.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discover-legacy-review-sources.mjs
      - name: Commit discovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/legacy-review-source-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "旧年度レビュー公表形式の調査結果を記録"
            git push
          fi
