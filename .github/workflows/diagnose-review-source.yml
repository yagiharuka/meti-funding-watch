name: Diagnose administrative review source
on:
  push:
    paths: [".github/workflows/diagnose-review-source.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current RS frontend assets
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          from urllib.parse import urljoin
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'}
          root='https://rssystem.go.jp/download-csv'
          html=urllib.request.urlopen(urllib.request.Request(root,headers=headers),timeout=30).read().decode('utf-8','replace')
          print('HTML',repr(html))
          assets=[]
          for src in re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|mjs|css)[^"\']*)',html):
            u=urljoin(root,src)
            if u not in assets: assets.append(u)
          print('ASSETS',assets)
          for u in assets:
            try:
              body=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
            except Exception as e:
              print('ASSET_ERR',u,repr(e)); continue
            text=body.decode('utf-8','replace')
            print('ASSET',u,'bytes',len(body))
            terms=['download-csv','fiscal-years','files/','支出先_支出情報','基本情報_組織情報','.zip','/api/','csv']
            for term in terms:
              positions=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
              for pos in positions[:12]:
                print('HIT',term,repr(text[max(0,pos-300):pos+500]))
          PY
