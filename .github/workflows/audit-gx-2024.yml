name: Audit GX 2024 crosswalk

on:
  push:
    branches: [main]
    paths:
      - scripts/audit-gx-2024.mjs
      - .github/workflows/audit-gx-2024.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-gx-2024.mjs
      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/gx-2024-crosswalk.json
          if ! git diff --cached --quiet; then
            git commit -m "GX2024採択先の横断監査結果を記録"
            git push
          fi
