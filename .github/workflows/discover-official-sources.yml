# 2026-08-18: 機関公表資料は照合用に限定したため、新規URL探索は
# 定期・push実行を行わず、必要時の手動監査だけに残します。
name: Discover new official source links

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: official-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover new official source links
        id: discovery
        continue-on-error: true
        run: npm run discover:official

      - name: Preserve official source discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-source-discovery-${{ github.run_id }}
          path: .audit/official-discovery/report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report candidates or unreachable official entrances
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/report-official-discovery.mjs

      - name: Warn when discovery itself failed
        if: steps.discovery.outcome != 'success'
        run: echo "::warning::公式資料リンクの手動探索処理に失敗しました。公開データは変更していません。"
