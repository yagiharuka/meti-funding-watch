name: Apply official supplement window from FY2021

on:
  push:
    branches: [main]
    paths:
      - ".official-window-2021-trigger"

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-official-window-2021
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Extend official supplement window to FY2021
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(before, after), encoding="utf-8")

          replace_once(
              "scripts/build-official-supplement-index.mjs",
              "const MIN_FISCAL_YEAR = 2024;",
              "const MIN_FISCAL_YEAR = 2021;",
          )
          replace_once(
              "scripts/build-official-supplement-index.mjs",
              "既存の機関公表資料キャッシュのうち、2024年度以降の経済産業省本省の契約結果・補助金等交付決定で金額を確認できた行を表示。機関公表資料自体は手動更新の照合系列であり、全公表の網羅を主張しない。",
              "既存の機関公表資料キャッシュのうち、2021年度以降の経済産業省本省の契約結果・補助金等交付決定で金額を確認できた行を表示。機関公表資料自体は手動更新の照合系列であり、全公表の網羅を主張しない。",
          )

          replace_once(
              "tests/official-supplement.test.mjs",
              "assert.equal(index.minFiscalYear, 2024);",
              "assert.equal(index.minFiscalYear, 2021);",
          )
          replace_once(
              "tests/official-supplement.test.mjs",
              "row.fiscalYear >= 2024",
              "row.fiscalYear >= 2021",
          )
          replace_once(
              "tests/official-supplement.test.mjs",
              "  assert.ok(index.records.length > 0);\n",
              "  assert.ok(index.records.length > 0);\n  assert.ok(index.records.some((row) => row.sourceId === \"meti\" && row.fiscalYear === 2021), \"経産省本省の2021年度レコードが必要です\");\n",
          )

          replace_once(
              "app/CombinedCompanyResults.tsx",
              "2024年度以降の最近の採択・交付決定・契約結果を補足します。確認できた公表情報だけで、網羅データではありません。",
              "2021年度以降を基本対象とする採択・交付決定・契約結果を補足します。機関ごとに実際の収録開始年度は異なり、確認できた公表情報だけを表示します。",
          )

          replace_once(
              "data/official-supplement-seeds.json",
              "公式補足は、経済産業省本省・NEDO・中小企業基盤整備機構について、受取先と金額を確認できた公表情報だけを表示する。各機関の全制度・全契約を網羅するものではなく、GビズINFO掲載値や行政事業レビュー支出額とは合算しない。",
              "公式補足は、経済産業省本省・NEDO・中小企業基盤整備機構について、2021年度以降を基本対象とし、受取先と金額を確認できた公表情報だけを表示する。機関ごとに実際の収録開始年度は異なる。各機関の全制度・全契約を網羅するものではなく、GビズINFO掲載値や行政事業レビュー支出額とは合算しない。",
          )

          workflow_path = Path(".github/workflows/update-data.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = '      - "data/official-reconciliation.json"\n'
          additions = (
              '      - "data/official/**"\n'
              '      - "data/official-supplement-seeds.json"\n'
              '      - "data/official-supplement-index.json"\n'
          )
          if additions not in workflow:
              if workflow.count(marker) != 1:
                  raise SystemExit("update-data.yml: insertion marker missing or duplicated")
              workflow = workflow.replace(marker, marker + additions)
              workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build and test the FY2021 official supplement
        run: |
          npm run test:pages
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('data/official-supplement-index.json', 'utf8'));
          if (index.minFiscalYear !== 2021) throw new Error(`minFiscalYear=${index.minFiscalYear}`);
          const meti2021 = index.records.filter((row) => row.sourceId === 'meti' && row.fiscalYear === 2021);
          if (!meti2021.length) throw new Error('経産省本省の2021年度レコードがありません');
          const ranges = Object.fromEntries(index.sources.map((source) => {
            const years = index.records.filter((row) => row.sourceId === source.id).map((row) => row.fiscalYear);
            return [source.id, { min: Math.min(...years), max: Math.max(...years), count: years.length }];
          }));
          console.log(JSON.stringify({ recordCount: index.recordCount, meti2021: meti2021.length, ranges }, null, 2));
          NODE

      - name: Commit verified changes and remove temporary files
        run: |
          rm -f .official-window-2021-trigger .github/workflows/apply-official-window-2021.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CombinedCompanyResults.tsx \
            scripts/build-official-supplement-index.mjs \
            tests/official-supplement.test.mjs \
            data/official-supplement-seeds.json \
            data/official-supplement-index.json \
            .github/workflows/update-data.yml \
            .github/workflows/apply-official-window-2021.yml \
            .official-window-2021-trigger
          git commit -m "公式補足を2021年度以降へ拡張"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push raced; retrying ($attempt/3)."
          done
          exit 1
