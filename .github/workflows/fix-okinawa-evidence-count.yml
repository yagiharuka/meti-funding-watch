name: Align Okinawa evidence count

on:
  push:
    paths:
      - ".github/workflows/fix-okinawa-evidence-count.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Update exact evidence count through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/contents/tests/official-evidence-receipts.test.mjs"
          gh api "$api?ref=main" > /tmp/file.json
          jq -r .content /tmp/file.json | tr -d '\n' | base64 -d > /tmp/test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/test.mjs')
          s=p.read_text()
          old='assert.equal(evidenceDocuments.length, 353); // 320 prior receipts + 33 Kanto FY2021-FY2024 PDFs'
          new='assert.equal(evidenceDocuments.length, 354); // 320 prior receipts + 33 Kanto FY2021-FY2024 PDFs + 1 Okinawa FY2019 H2 PDF'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          sha="$(jq -r .sha /tmp/file.json)"
          encoded="$(base64 -w0 /tmp/test.mjs)"
          jq -n --arg message "test(official): count Okinawa FY2019 H2 evidence" --arg content "$encoded" --arg sha "$sha" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' \
            | gh api --method PUT "$api" --input -
