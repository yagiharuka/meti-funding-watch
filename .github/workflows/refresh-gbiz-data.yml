name: Refresh Gbiz funding data

on:
  workflow_dispatch:
  # Automatic data refresh paused on 2026-10-13; run manually when needed.
  # schedule:
  #   - cron: "0 21 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: gbiz-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh only Gbiz series
        run: npm run update:data
      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gbiz-source-evidence-${{ github.run_id }}
          path: .audit/gbiz
          if-no-files-found: warn
          retention-days: 90
      - name: Validate Gbiz snapshot before commit
        run: node --test tests/funding-data.test.mjs tests/gbiz-refresh.test.mjs
      - name: Commit only Gbiz data
        id: commit_data
        run: |
          if git diff --quiet -- data/funding-data.json data/funding-summary.json data/pages; then
            echo "Gbiz data unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -z "$(git status --porcelain -- data/official data/review-cache)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/funding-data.json data/funding-summary.json data/pages
          git commit -m "chore(data): refresh Gbiz funding data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push raced with another series; retrying ($attempt/3)."
          done
          echo "::error::Could not publish Gbiz data after three rebases."
          exit 1
      # GITHUB_TOKENで作ったbot commitはpush workflowを起動しないため、公開を明示的に依頼する。
      - name: Publish the refreshed snapshot
        if: steps.commit_data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-data.yml --ref main -f publish_only=true
