name: Apply combined company search

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-combined-company-search.mjs
      - .github/workflows/apply-combined-company-search.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-combined-company-search.mjs
      - run: node scripts/build-review-company-index.mjs
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx package.json vite.pages.config.ts data/review-company-index.json
          if ! git diff --cached --quiet; then
            git commit -m "企業検索でGビズとレビューを同時表示"
            git push
          fi
      - run: npm ci
      - run: npm run build:pages
