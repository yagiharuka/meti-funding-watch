name: Backfill NEDO public results once

on:
  push:
    branches:
      - feat/nedo-2017-2025-public-results-20260825
    paths:
      - ".github/workflows/backfill-nedo-public-results-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify NEDO parser fixtures
        run: node --test tests/nedo-public-results.test.mjs

      - name: Backfill NEDO FY2017-FY2025 official result participants
        run: node scripts/nedo-public-results.mjs --years=2017-2025

      - name: Commit backfilled NEDO result index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official-supplement-nedo-public-results.json
          git diff --cached --quiet && { echo "::error::Expected NEDO backfill output to change."; exit 1; }
          git commit -m "chore(data): backfill NEDO public results 2017-2025"
          git push origin HEAD:${GITHUB_REF_NAME}
