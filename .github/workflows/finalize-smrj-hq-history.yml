name: Finalize SMRJ headquarters history reingest

on:
  push:
    branches:
      - reingest/smrj-hq-history-20260825-release5
    paths:
      - ".github/workflows/finalize-smrj-hq-history.yml"
      - "data/official-supplement-seeds.json"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: finalize-smrj-hq-history
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out the reingest branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reingest/smrj-hq-history-20260825-release5
          fetch-depth: 0

      - name: Stop until the one-time reingest has completed successfully
        id: ready
        shell: bash
        run: |
          if [ -f .github/workflows/reingest-smrj-hq-history-once.yml ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The one-time reingest workflow is still present."
            exit 0
          fi
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const seeds = JSON.parse(await readFile("data/official-supplement-seeds.json", "utf8"));
            const source = seeds.sources.find((item) => item.id === "smrj");
            if (!source || source.collectionStatus !== "complete" || source.scope?.organizationUnit !== "本部" || source.scope?.fiscalYearFrom !== 2015) process.exit(2);
            if (source.parseFailureCount !== 0 || source.records.length < 50 || source.discoveredDocumentCount < 20) process.exit(3);
            if (source.printedRowCount !== source.records.length + source.duplicateRecordCount + source.amountUnavailableCount) process.exit(4);
          '
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: npm ci

      - name: Remove the finalizer and run the complete repository verification
        if: steps.ready.outputs.ready == 'true'
        run: |
          git rm .github/workflows/finalize-smrj-hq-history.yml
          npm test

      - name: Commit the final branch state
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/finalize-smrj-hq-history.yml
          git commit -m "ci: finalize SMRJ headquarters history reingest"
          git restore .
          git clean -fd
          git pull --rebase origin reingest/smrj-hq-history-20260825-release5
          git push origin HEAD:reingest/smrj-hq-history-20260825-release5

      - name: Squash merge the validated pull request
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr_number=$(gh pr list --head reingest/smrj-hq-history-20260825-release5 --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "::error::Open pull request not found."
            exit 1
          fi
          gh pr merge "$pr_number" --squash --admin --subject "中小機構本部の競争入札・随意契約を2015年度から再収録" --body "本部のみを対象に、競争入札・随意契約の公式PDFを年度×契約類型で棚卸しし、行数会計とfail-closed検証を通過した履歴を公開する。"

      - name: Dispatch and watch the verified Pages publication
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run update-data.yml --ref main -f publish_only=true
          sleep 8
          run_id=$(gh run list --workflow update-data.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Publication workflow run was not found."
            exit 1
          fi
          gh run watch "$run_id" --exit-status
