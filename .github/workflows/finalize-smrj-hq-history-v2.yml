name: Finalize SMRJ headquarters history reingest v2

on:
  push:
    branches:
      - reingest/smrj-hq-history-20260825-release5
    paths:
      - ".github/workflows/finalize-smrj-hq-history-v2.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: finalize-smrj-hq-history-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the reingest branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reingest/smrj-hq-history-20260825-release5
          fetch-depth: 0

      - name: Wait for the one-time live reingest
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            git fetch origin reingest/smrj-hq-history-20260825-release5
            git reset --hard origin/reingest/smrj-hq-history-20260825-release5
            if [ ! -f .github/workflows/reingest-smrj-hq-history-once.yml ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -f .audit/smrj-hq-full-history.log ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "The live reingest failed; preserving the audit tail on PR #73."
              {
                echo '### 中小機構本部・全履歴再収録の失敗ログ'
                echo
                echo '```text'
                tail -n 120 .audit/smrj-hq-full-history.log
                echo '```'
              } > /tmp/smrj-comment.md
              gh pr comment 73 --body-file /tmp/smrj-comment.md
              exit 1
            fi
            sleep 30
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::Timed out waiting for the live reingest."
          exit 1

      - name: Set up Node.js
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: npm ci

      - name: Validate the committed full-history result
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const seeds = JSON.parse(await readFile("data/official-supplement-seeds.json", "utf8"));
            const source = seeds.sources.find((item) => item.id === "smrj");
            if (!source) throw new Error("SMRJ source missing");
            if (source.collectionStatus !== "complete") throw new Error(`collectionStatus=${source.collectionStatus}`);
            if (source.scope?.organizationUnit !== "本部") throw new Error(`organizationUnit=${source.scope?.organizationUnit}`);
            if (source.scope?.fiscalYearFrom !== 2015) throw new Error(`fiscalYearFrom=${source.scope?.fiscalYearFrom}`);
            if (source.parseFailureCount !== 0) throw new Error(`parseFailureCount=${source.parseFailureCount}`);
            if (source.records.length < 50) throw new Error(`records=${source.records.length}`);
            if (source.discoveredDocumentCount < 20) throw new Error(`documents=${source.discoveredDocumentCount}`);
            if (source.parsedDocumentCount + source.noResultDocumentCount !== source.totalDocumentCount) throw new Error("document accounting mismatch");
            if (source.printedRowCount !== source.records.length + source.duplicateRecordCount + source.amountUnavailableCount) throw new Error("row accounting mismatch");
            const currentYear = new Date().getUTCMonth() + 1 >= 4 ? new Date().getUTCFullYear() : new Date().getUTCFullYear() - 1;
            for (let year = 2015; year <= currentYear; year += 1) {
              const kinds = source.coverageMatrix?.[year] ?? [];
              if (!kinds.includes("competitive") || !kinds.includes("discretionary")) throw new Error(`coverage gap ${year}: ${kinds.join(",")}`);
            }
            console.log(JSON.stringify({
              records: source.records.length,
              documents: source.totalDocumentCount,
              parsedDocuments: source.parsedDocumentCount,
              noResultDocuments: source.noResultDocumentCount,
              printedRows: source.printedRowCount,
              amountUnavailable: source.amountUnavailableCount,
              duplicates: source.duplicateRecordCount,
              fiscalYearFrom: source.scope.fiscalYearFrom,
              fiscalYearTo: source.scope.fiscalYearTo,
            }));
          '
          npm test

      - name: Remove finalizers and push the validated branch
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-smrj-hq-history-v2.yml
          if [ -f .github/workflows/finalize-smrj-hq-history.yml ]; then
            git rm .github/workflows/finalize-smrj-hq-history.yml
          fi
          git commit -m "ci: finalize SMRJ headquarters history reingest"
          git restore .
          git clean -fd
          git pull --rebase origin reingest/smrj-hq-history-20260825-release5
          git push origin HEAD:reingest/smrj-hq-history-20260825-release5

      - name: Squash merge the validated pull request
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 73 --squash --admin \
            --subject "中小機構本部の競争入札・随意契約を2015年度から再収録" \
            --body "本部のみを対象に、競争入札・随意契約の公式PDFを年度×契約類型で棚卸しし、行数会計とfail-closed検証を通過した履歴を公開する。"

      - name: Publish and verify GitHub Pages
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run update-data.yml --ref main -f publish_only=true
          sleep 10
          run_id=$(gh run list --workflow update-data.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Publication workflow run was not found."
            exit 1
          fi
          gh run watch "$run_id" --exit-status
