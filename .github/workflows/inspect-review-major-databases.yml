name: Inspect review major databases

on:
  push:
    branches: [main]
    paths:
      - scripts/inspect-review-major-databases.mjs
      - .github/workflows/inspect-review-major-databases.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/inspect-review-major-databases.mjs
      - name: Commit inspection result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/review-major-database-inspection.json
          git commit -m "旧レビュー統合Excelの構造調査結果を記録" || exit 0
          git push
