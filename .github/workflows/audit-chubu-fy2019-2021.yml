name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WARP frontend scripts for PDF download endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -f -A 'Mozilla/5.0' 'https://warp.ndl.go.jp/' -o /tmp/home.html
          echo HOME_SIZE=$(wc -c < /tmp/home.html)
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.s=[]
              def handle_starttag(self,t,a):
                  if t=='script':
                      u=dict(a).get('src')
                      if u: self.s.append(urljoin('https://warp.ndl.go.jp/',u))
          p=P(); p.feed(open('/tmp/home.html',errors='replace').read())
          p.s=list(dict.fromkeys(p.s))
          print('SCRIPTS',len(p.s))
          for u in p.s: print(u)
          open('/tmp/scripts.txt','w').write('\n'.join(p.s)+'\n')
          PY
          i=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            i=$((i+1))
            curl -sS -f --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$u" -o "/tmp/s$i.js" || continue
            echo "=== SCRIPT $i $u size=$(wc -c < /tmp/s$i.js) ==="
            grep -Eio '.{0,180}(pdf.{0,80}download|download.{0,80}pdf|downloadPdf|pdfDownload|contentDownload|downloadUrl|download_url|rawUrl|originalUrl|memento|timemap|/api/|fetch\().{0,220}' "/tmp/s$i.js" | head -300 || true
          done < /tmp/scripts.txt
          echo '=== ALL ENDPOINT-LIKE STRINGS ==='
          cat /tmp/s*.js 2>/dev/null | strings | grep -Eio '[/][A-Za-z0-9_?=&.%:-]{1,120}(download|content|resource|memento|archive|file|pdf)[A-Za-z0-9_/?=&.%:-]{0,160}' | sort -u | head -500 || true