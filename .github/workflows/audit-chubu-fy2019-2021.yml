name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test WARP Memento TimeGate
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL='https://www.chubu.meti.go.jp/a41kaikei/kouhyou/data/hojyokin/r3fy-4-9-hojyokin.pdf'
          TG="https://warp.ndl.go.jp/collections/$ORIGINAL"
          echo "TIMEGATE=$TG"
          curl -sS -D /tmp/timegate.headers -o /tmp/timegate.body \
            -H 'Accept-Datetime: Mon, 01 Jun 2026 01:14:04 GMT' \
            -A 'Mozilla/5.0' "$TG" || true
          cat /tmp/timegate.headers
          echo 'BODY:'
          head -c 500 /tmp/timegate.body || true
          echo
          LOC=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); print substr($0,11)}' /tmp/timegate.headers | tail -1)
          test -n "$LOC"
          echo "LOCATION=$LOC"
          curl -sS -fL --retry 3 --retry-all-errors -A 'Mozilla/5.0' "$LOC" -o /tmp/source.bin
          wc -c /tmp/source.bin
          sha256sum /tmp/source.bin
          xxd -l 16 /tmp/source.bin