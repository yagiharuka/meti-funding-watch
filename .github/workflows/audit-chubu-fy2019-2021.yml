name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WARP viewer HTML for raw download target
        shell: bash
        run: |
          set -euo pipefail
          U='https://warp.ndl.go.jp/web/20220104015622/https://www.chubu.meti.go.jp/a41kaikei/kouhyou/data/hojyokin/r3fy-4-9-hojyokin.pdf'
          curl -sS -f -A 'Mozilla/5.0' "$U" -o /tmp/viewer.html
          echo SIZE=$(wc -c < /tmp/viewer.html)
          sed -n '1,260p' /tmp/viewer.html
          echo '=== URL-LIKE ==='
          grep -Eoi 'https?://[^"<> ]+|/[^"<> ]*(download|pdf|content|resource|raw|file)[^"<> ]*' /tmp/viewer.html | head -200 || true
          echo '=== KEYWORDS ==='
          grep -Ein 'download|pdf|iframe|embed|object|content|resource|raw|original|fetch|api' /tmp/viewer.html | head -200 || true