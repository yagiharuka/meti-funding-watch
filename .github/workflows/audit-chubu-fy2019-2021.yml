name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify one raw WARP PDF from viewer iframe
        shell: bash
        run: |
          set -euo pipefail
          VIEWER='https://warp.ndl.go.jp/web/20211201021011/https://www.chubu.meti.go.jp/a41kaikei/kouhyou/data/hojyokin/r3fy-4-9-hojyokin.pdf'
          sleep 8
          curl -sS -f --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$VIEWER" -o /tmp/viewer.html
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.src=None
              def handle_starttag(self,t,a):
                  if t=='iframe' and dict(a).get('id')=='pywb-frame': self.src=dict(a).get('src')
          p=P(); p.feed(open('/tmp/viewer.html',errors='replace').read())
          assert p.src, 'iframe source missing'
          raw=urljoin('https://warp.ndl.go.jp/',p.src)
          print('RAW_URL',raw)
          open('/tmp/raw-url.txt','w').write(raw+'\n')
          PY
          RAW=$(cat /tmp/raw-url.txt)
          sleep 8
          code=$(curl -sS --connect-timeout 10 --max-time 60 -D /tmp/raw.headers -o /tmp/raw.bin -w '%{http_code}' -A 'Mozilla/5.0' -e "$VIEWER" "$RAW" || true)
          echo CODE=$code
          cat /tmp/raw.headers
          echo BYTES=$(wc -c < /tmp/raw.bin)
          echo MAGIC=$(xxd -p -l 8 /tmp/raw.bin)
          test "$code" = 200
          test "$(head -c 5 /tmp/raw.bin)" = '%PDF-'
          sha256sum /tmp/raw.bin