name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all WARP frontend JS assets
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -f -A 'Mozilla/5.0' 'https://warp.ndl.go.jp/' -o /tmp/home.html
          echo HOME_SIZE=$(wc -c < /tmp/home.html)
          echo '=== JS REFERENCES ==='
          grep -Eo '(/[^"'"' <>]+\.js[^"'"' <>]*)' /tmp/home.html | sort -u | tee /tmp/jsrefs.txt || true
          echo '=== ASTRO/MODULE REFERENCES ==='
          grep -Ein 'astro|modulepreload|client:|component-url|renderer-url|\.js' /tmp/home.html | head -300 || true
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          h=open('/tmp/home.html',errors='replace').read()
          refs=re.findall(r'(?:src|href|component-url|renderer-url)=["\']([^"\']+\.js[^"\']*)',h,re.I)
          refs += re.findall(r'["\'](/assets/[^"\']+\.js[^"\']*)["\']',h)
          refs=list(dict.fromkeys(urljoin('https://warp.ndl.go.jp/',x.replace('&amp;','&')) for x in refs))
          print('ASSETS',len(refs))
          for u in refs: print(u)
          open('/tmp/assets.txt','w').write('\n'.join(refs)+'\n')
          PY
          i=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            i=$((i+1))
            curl -sS -f --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$u" -o "/tmp/a$i.js" || continue
            echo "=== ASSET $i $u size=$(wc -c < /tmp/a$i.js) ==="
            grep -Eio '.{0,180}(PDFをダウンロード|pdf.{0,120}download|download.{0,120}pdf|downloadPdf|pdfDownload|downloadUrl|download_url|rawUrl|originalUrl|memento|timemap|/api/|fetch\(|axios|blob\().{0,260}' "/tmp/a$i.js" | head -300 || true
          done < /tmp/assets.txt
          echo '=== UNIQUE URL/ROUTE STRINGS ==='
          cat /tmp/a*.js 2>/dev/null | grep -Eo 'https?://[^"'"'` ]+|/[A-Za-z0-9_.?=&%:@+-]{2,180}' | grep -Ei 'download|pdf|content|resource|archive|memento|api|raw|file' | sort -u | head -500 || true