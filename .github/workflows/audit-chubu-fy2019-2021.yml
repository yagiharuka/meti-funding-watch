name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture verified historical source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit-chubu-hist/files
          INDEX='https://warp.ndl.go.jp/20260613/20260601101404/https://www.chubu.meti.go.jp/a41kaikei/kouhyou/index.html'
          curl -sS -f -A 'Mozilla/5.0' "$INDEX" -o .audit-chubu-hist/index.html
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.a=[]
              def handle_starttag(self,t,a):
                  if t=='a' and dict(a).get('href'): self.a.append(dict(a)['href'])
          h=Path('.audit-chubu-hist/index.html').read_text(errors='replace'); p=P(); p.feed(h)
          base='https://warp.ndl.go.jp/20260613/20260601101404/https://www.chubu.meti.go.jp/a41kaikei/kouhyou/index.html'
          keys=('r3fy','r2fy','21-','20-'); out=[]
          for href in p.a:
              low=href.lower().split('?')[0]
              if not ((any(k in low for k in keys) and low.endswith('.pdf')) or ('/a41kaikei/kouhyou/data/' in low and low.endswith(('.xlsx','.xls')))): continue
              old=urljoin(base,href); original='https://'+old.split('/https://',1)[1]
              if original not in out: out.append(original)
          assert len(out)==18, len(out)
          Path('.audit-chubu-hist/original-urls.txt').write_text('\n'.join(out)+'\n')
          PY
          : > .audit-chubu-hist/receipts.tsv
          : > .audit-chubu-hist/raw-urls.tsv
          i=0
          while IFS= read -r original; do
            [ -n "$original" ] || continue
            i=$((i+1)); fn=$(basename "${original%%\?*}"); echo "=== [$i/18] $fn ==="
            curl -sS -f --retry 4 --retry-all-errors --retry-delay 3 -A 'Mozilla/5.0' "https://warp.ndl.go.jp/collections/timemap/$original" -o /tmp/timemap.txt
            python - "$original" <<'PY'
          import re,sys
          original=sys.argv[1]; s=open('/tmp/timemap.txt').read(); esc=re.escape(original)
          urls=list(dict.fromkeys(re.findall(r'<(https://warp\.ndl\.go\.jp/web/\d{14}/'+esc+r')>;\s*rel="[^"]*memento[^"]*"',s)))
          assert urls, original
          picks=[]
          for idx in [0,1,2,4,8,12,16,20,24,28,32,36,40,44,-1]:
              if -len(urls)<=idx<len(urls) and urls[idx] not in picks: picks.append(urls[idx])
          open('/tmp/viewers.txt','w').write('\n'.join(picks)+'\n')
          PY
            viewer=''
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue; sleep 3
              code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/viewer.html -w '%{http_code}' -A 'Mozilla/5.0' "$candidate" || true)
              if [ "$code" = 200 ] && grep -q 'id="pywb-frame"' /tmp/viewer.html; then viewer="$candidate"; break; fi
            done < /tmp/viewers.txt
            test -n "$viewer"
            python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.src=None
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t=='iframe' and d.get('id')=='pywb-frame': self.src=d.get('src')
          p=P(); p.feed(open('/tmp/viewer.html',errors='replace').read()); assert p.src
          open('/tmp/raw-url.txt','w').write(urljoin('https://warp.ndl.go.jp/',p.src)+'\n')
          PY
            raw=$(cat /tmp/raw-url.txt); sleep 3
            out=".audit-chubu-hist/files/$(printf '%02d' "$i")__${fn}"
            code=$(curl -sS --connect-timeout 10 --max-time 90 --retry 4 --retry-all-errors --retry-delay 4 -o "$out" -w '%{http_code}' -A 'Mozilla/5.0' -e "$viewer" "$raw" || true)
            test "$code" = 200
            bytes=$(wc -c < "$out"); sha=$(sha256sum "$out" | cut -d' ' -f1); magic=$(xxd -p -l 8 "$out")
            case "$fn" in *.pdf) test "$(head -c 5 "$out")" = '%PDF-' ;; *.xlsx) test "$(xxd -p -l 4 "$out")" = '504b0304' ;; *.xls) test "$(xxd -p -l 8 "$out")" = 'd0cf11e0a1b11ae1' ;; esac
            printf '%02d\t%s\t%s\t%s\t%s\n' "$i" "$bytes" "$sha" "$magic" "$original" | tee -a .audit-chubu-hist/receipts.tsv
            printf '%02d\t%s\t%s\n' "$i" "$viewer" "$raw" >> .audit-chubu-hist/raw-urls.tsv
          done < .audit-chubu-hist/original-urls.txt
          test "$i" -eq 18
      - uses: actions/upload-artifact@v4
        with:
          name: chubu-fy2019-2021-audit-${{ github.run_id }}
          path: .audit-chubu-hist
          include-hidden-files: true
          retention-days: 90