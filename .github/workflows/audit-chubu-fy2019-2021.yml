name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WARP PDF viewer with browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          U='https://warp.ndl.go.jp/web/20220104015622/https://www.chubu.meti.go.jp/a41kaikei/kouhyou/data/hojyokin/r3fy-4-9-hojyokin.pdf'
          BROWSER=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          echo "BROWSER=$BROWSER"
          test -n "$BROWSER"
          "$BROWSER" --version
          sleep 20
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --virtual-time-budget=15000 --dump-dom "$U" > /tmp/dom.html 2>/tmp/chrome.err || true
          echo '=== CHROME ERR ==='
          tail -100 /tmp/chrome.err || true
          echo DOM_SIZE=$(wc -c < /tmp/dom.html)
          echo '=== RELEVANT DOM ==='
          grep -Ein 'download|PDF|iframe|embed|object|content|resource|raw|original|blob|file|web/' /tmp/dom.html | head -300 || true
          echo '=== LINKS ==='
          python - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.items=[]
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t in ('a','iframe','embed','object','button'):
                      self.items.append((t,d))
          h=open('/tmp/dom.html',errors='replace').read(); p=P(); p.feed(h)
          for t,d in p.items:
              s=' '.join(f'{k}={v}' for k,v in d.items())
              if any(x in s.lower() for x in ('pdf','download','content','resource','raw','original','web/')):
                  print(t,s)
          PY
          test -s /tmp/dom.html