name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all WARP frontend JS assets safely
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -f -A 'Mozilla/5.0' 'https://warp.ndl.go.jp/' -o /tmp/home.html
          echo HOME_SIZE=$(wc -c < /tmp/home.html)
          python - <<'PY'
          import re
          from html import unescape
          from urllib.parse import urljoin
          h=open('/tmp/home.html',errors='replace').read()
          refs=[]
          for pat in [
              r'(?:src|href|component-url|renderer-url)=["\']([^"\']+\.js[^"\']*)',
              r'["\'](/assets/[^"\']+\.js[^"\']*)["\']',
          ]:
              refs.extend(re.findall(pat,h,re.I))
          refs=list(dict.fromkeys(urljoin('https://warp.ndl.go.jp/',unescape(x)) for x in refs))
          print('ASSETS',len(refs))
          for u in refs: print(u)
          open('/tmp/assets.txt','w').write('\n'.join(refs)+'\n')
          print('ASTRO_LINES')
          for i,line in enumerate(h.splitlines(),1):
              if any(k in line.lower() for k in ('astro','modulepreload','component-url','renderer-url','.js')):
                  print(i,line[:1200])
          PY
          i=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            i=$((i+1))
            curl -sS -f --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$u" -o "/tmp/a$i.js" || continue
            echo "=== ASSET $i $u size=$(wc -c < /tmp/a$i.js) ==="
          done < /tmp/assets.txt
          python - <<'PY'
          import glob,re
          pats=re.compile(r'pdf|download|memento|timemap|fetch\(|axios|blob\(|originalurl|downloadurl|/api/|content|resource|archive|raw',re.I)
          route=re.compile(r'https?://[^"\'`\s]+|/[A-Za-z0-9_.?=&%:@+\-]{2,220}')
          for f in glob.glob('/tmp/a*.js'):
              s=open(f,errors='replace').read()
              print('FILE',f,'LEN',len(s))
              for m in pats.finditer(s):
                  a=max(0,m.start()-220); b=min(len(s),m.end()+320)
                  print('CTX',s[a:b].replace('\n',' ')[:700])
              for x in sorted(set(route.findall(s))):
                  if re.search(r'download|pdf|content|resource|archive|memento|api|raw|file',x,re.I):
                      print('ROUTE',x[:400])
          PY