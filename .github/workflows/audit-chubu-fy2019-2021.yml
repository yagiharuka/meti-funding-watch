name: Audit Chubu FY2019-FY2021 sources
on:
  push:
    paths: [".github/workflows/audit-chubu-fy2019-2021.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve raw legacy WARP URL from TimeMap
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL='https://www.chubu.meti.go.jp/a41kaikei/kouhyou/data/hojyokin/r3fy-4-9-hojyokin.pdf'
          TM="https://warp.ndl.go.jp/collections/timemap/$ORIGINAL"
          curl -sS -f -A 'Mozilla/5.0' "$TM" -o /tmp/timemap.txt
          python - <<'PY'
          import re
          s=open('/tmp/timemap.txt').read()
          stamps=re.findall(r'https://warp\.ndl\.go\.jp/web/(\d{14})/https://www\.chubu\.meti\.go\.jp/a41kaikei/kouhyou/data/hojyokin/r3fy-4-9-hojyokin\.pdf',s)
          stamps=list(dict.fromkeys(stamps))
          open('/tmp/stamps.txt','w').write('\n'.join(stamps)+'\n')
          print('STAMPS',len(stamps),stamps[:10])
          PY
          n=0
          while IFS= read -r stamp; do
            [ -n "$stamp" ] || continue
            n=$((n+1))
            day=${stamp:0:8}
            for tilde in '' '~'; do
              if [ -n "$tilde" ]; then
                u="https://warp.ndl.go.jp/$day/$stamp/~$ORIGINAL"
              else
                u="https://warp.ndl.go.jp/$day/$stamp/$ORIGINAL"
              fi
              code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/raw.bin -w '%{http_code}' -A 'Mozilla/5.0' "$u" || true)
              bytes=$(wc -c < /tmp/raw.bin)
              magic=$(xxd -p -l 8 /tmp/raw.bin)
              echo "$n stamp=$stamp tilde=${tilde:-no} code=$code bytes=$bytes magic=$magic $u"
              if [ "$code" = 200 ] && [ "$(head -c 5 /tmp/raw.bin)" = '%PDF-' ]; then
                echo "RAW_SUCCESS=$u"
                sha256sum /tmp/raw.bin
                exit 0
              fi
            done
            [ "$n" -ge 12 ] && break
          done < /tmp/stamps.txt
          exit 1