name: One-off build central agency history

on:
  push:
    branches: [main]
    paths:
      - "probe-central-agencies-trigger.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract historical official rows
        run: |
          set +e
          node scripts/oneoff-build-smrj-nedo-history.mjs > central-agencies-probe.log 2>&1
          code=$?
          echo "CENTRAL_AGENCY_BUILD_EXIT=$code" >> central-agencies-probe.log
          cat central-agencies-probe.log
          exit 0
      - name: Commit extraction result or diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add central-agencies-probe.log
          if test -f data/official-central-history.json; then
            git add data/official-central-history.json
          fi
          git commit -m "chore(audit): build central agency history"
          git pull --rebase origin main
          git push
