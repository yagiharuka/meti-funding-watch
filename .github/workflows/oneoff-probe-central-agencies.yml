name: One-off probe central agency history

on:
  push:
    branches: [main]
    paths:
      - "probe-central-agencies-trigger.txt"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe PDFs
        run: node scripts/oneoff-probe-smrj-nedo-history.mjs > central-agencies-probe.log 2>&1
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add central-agencies-probe.log
          git commit -m "chore(audit): record central agency PDF probe"
          git pull --rebase origin main
          git push
