name: One-off probe institution PDFs

on:
  push:
    branches: [main]
    paths:
      - "probe-institution-pdfs-trigger.txt"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe PDF layouts
        run: |
          set +e
          node scripts/oneoff-probe-institution-pdfs.mjs > institution-pdf-layout.log 2>&1
          code=$?
          echo "INSTITUTION_PDF_PROBE_EXIT=$code" >> institution-pdf-layout.log
          cat institution-pdf-layout.log
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add institution-pdf-layout.log
          git commit -m "chore(audit): record FY2017 institution PDF layout"
          git pull --rebase origin main
          git push
