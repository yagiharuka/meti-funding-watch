name: Regenerate official supplement index once

on:
  push:
    branches:
      - fix/rieti-gap-validation-and-candidate-copy-20260824
    paths:
      - ".github/workflows/regenerate-official-index-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify declared Gbiz gaps
        run: node scripts/official-gbiz-gap-audit.mjs

      - name: Regenerate committed derived index
        run: node scripts/build-official-supplement-index.mjs

      - name: Commit regenerated index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official-supplement-index.json
          git diff --cached --quiet && { echo "::error::Expected regenerated index to change."; exit 1; }
          git commit -m "chore(data): sync official index after gap-policy update"
          git push origin HEAD:${GITHUB_REF_NAME}
