name: Regenerate official supplement index once

on:
  push:
    branches:
      - fix/m026-derived-index-sync-20260824
    paths:
      - ".github/workflows/regenerate-official-index-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate committed derived index
        run: node scripts/build-official-supplement-index.mjs

      - name: Finalize M-024 and M-026 catalog entries
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/MISREADING_CATALOG.md';
          let text = fs.readFileSync(path, 'utf8');
          const m024 = '| M-024 | UI失敗時 | 公式補足の自動取得元のHTML・PDF・Excel形式が変わりparserが0件・誤解析になっても、正常更新されたように見える | 高 | 企業検索の公式補足（自動取得） | 月次自動取得する各機関で、取得失敗、対象年度・見出し消失、0件、列構造変化、資料数・掲載行数の後退、既存行の識別情報・名称・金額の変化をfail-closedで停止する。金額非公表行や単価表示は0円・契約総額へ変換せず別計数する | `scripts/nedo-official-supplement.mjs`, `scripts/smrj-official-supplement.mjs`, `scripts/jetro-official-supplement.mjs`, `scripts/aist-official-supplement.mjs`, `scripts/nite-official-supplement.mjs`, `scripts/ipa-official-supplement.mjs`, `scripts/inpit-official-supplement.mjs`, `scripts/rieti-official-supplement.mjs`, `scripts/jogmec-official-supplement.mjs` | `tests/nedo-official-supplement.test.mjs`, `tests/smrj-official-supplement.test.mjs`, `tests/jetro-official-supplement.test.mjs`, `tests/aist-official-supplement.test.mjs`, `tests/nite-official-supplement.test.mjs`, `tests/ipa-official-supplement.test.mjs`, `tests/inpit-official-supplement.test.mjs`, `tests/rieti-official-supplement.test.mjs`, `tests/jogmec-official-supplement.test.mjs` | MITIGATED |';
          const m026 = '| M-026 | 出典・鮮度 | GitHub上のコミット済み公式補足索引＝現在のビルダが生成する公開用派生データ | 高 | GitHub上のJSON、再利用・監査 | `official-supplement-index.json` を現行ビルダ出力で同期し、CIのclean checkoutで再生成した後にコミット済みファイルとの差分があれば失敗させる。月次公式更新でも同派生索引を明示的なcommit対象として維持する | `scripts/build-official-supplement-index.mjs`, `.github/workflows/ci.yml`, `.github/workflows/refresh-official-data.yml` | CI `Verify committed official supplement index` | MITIGATED |';
          const lines = text.split('\n').map((line) => {
            if (line.startsWith('| M-024 |')) return m024;
            if (line.startsWith('| M-026 |')) return m026;
            return line;
          });
          text = lines.join('\n');
          const openStart = text.indexOf('## OPEN項目');
          const noteStart = text.indexOf('## 注記配置の原則');
          if (openStart < 0 || noteStart < 0 || noteStart <= openStart) throw new Error('OPEN項目セクションを検出できません');
          const openSection = `## OPEN項目\n\n\`OPEN\` は修正漏れではなく、次の監査・修正対象を明示するための状態です。現在の未対策は次の3件です。\n\n1. **M-020** 0円掲載を最終的な交付額・受注額0円と断定できるように見える問題。\n2. **M-008** 旧商号を入力すれば現在の同一法人を必ず検索できるように見える問題。\n3. **M-021** 「掲載N件」を一意な案件数・交付件数と読める問題。\n\nM-020はGビズINFO全件CSVに状態情報がないため、0円行の意味を原典側でどこまで確定できるかを調べるまで対策済みにしません。M-008は旧商号履歴の根拠データをどこまで保持できるかを確認するまで対策済みにしません。M-021は表示を「掲載行」に統一すれば足りるか、検索結果・企業カード・詳細画面を通して確認してから対応します。\n\n`;
          text = `${text.slice(0, openStart)}${openSection}${text.slice(noteStart)}`;
          fs.writeFileSync(path, text);
          NODE

      - name: Commit regenerated index and catalog state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official-supplement-index.json docs/MISREADING_CATALOG.md
          git diff --cached --quiet && { echo "::error::Expected regenerated files to change."; exit 1; }
          git commit -m "chore(data): sync official supplement derived index"
          git push origin HEAD:${GITHUB_REF_NAME}
