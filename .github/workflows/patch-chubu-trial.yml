name: Refine Chubu FY2023 parser trial
on:
  push:
    paths:
      - ".github/workflows/patch-chubu-trial.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply explicit old-format settings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/audit-chubu-fy2023.yml')
          s=p.read_text()
          for end in (170,54,7,29,41):
              old=f"expectedRowNumbers:{{start:1,end:{end}}},requiredPageText"
              new=f"expectedRowNumbers:{{start:1,end:{end}}},headersOnFirstPageOnly:true,requiredPageText"
              if old not in s: raise SystemExit(f'missing {old}')
              s=s.replace(old,new,1)
          old="corporateNumberMissingSentinels:[''],minimumPositionedTextItems:1}},"
          if s.count(old) != 2: raise SystemExit(f'expected 2 grant sentinels, got {s.count(old)}')
          s=s.replace(old,"corporateNumberMissingSentinels:['','-','－'],minimumPositionedTextItems:1}},")
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/audit-chubu-fy2023.yml
          git commit -m 'ci(official): handle Chubu FY2023 old PDF layout'
          git push
