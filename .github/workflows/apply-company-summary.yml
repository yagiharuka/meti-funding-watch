name: Apply company summary UI

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-company-summary.mjs
      - .github/workflows/apply-company-summary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/apply-company-summary.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/funding-search.worker.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "企業検索サマリーを追加"
            git push
          fi
